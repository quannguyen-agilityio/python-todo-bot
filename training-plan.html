, "code": "[tool.mypy]\nstrict = true", "lang": "toml"}, {"t": ["Run mypy. Strict mode will complain about every unannotated function and every value that may be `None`.", "Chạy mypy. Chế độ strict sẽ báo mọi hàm chưa có type và mọi giá trị có thể là `None`."], "run": "uv run mypy src/", "out": "src/todo_bot/handlers.py:72: error: Function is missing a type annotation  [no-untyped-def]\nsrc/todo_bot/handlers.py:73: error: Item \"None\" of \"Message | None\" has no attribute \"reply_text\"  [union-attr]\n..."}, {"t": ["Typical fixes for the handlers. Apply the same pattern to every handler, then use the final `handlers.py` below as a reference.", "Cách sửa điển hình cho handler. Làm tương tự cho mọi handler, rồi đối chiếu với `handlers.py` hoàn chỉnh bên dưới."], "f": "bot/src/todo_bot/handlers.py", "act": "edit", "code": "from telegram import Update\nfrom telegram.ext import ContextTypes\n\n\nasync def start(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:\n    assert update.message is not None      # tells mypy: not None here\n    await update.message.reply_text(HELP)", "lang": "python"}, {"t": ["Reference: the final, strict-clean `handlers.py` and `main.py`.", "Tham khảo: `handlers.py` và `main.py` hoàn chỉnh, qua được strict."], "f": "bot/src/todo_bot/handlers.py", "act": "replace", "code": "import datetime as dt\nfrom pathlib import Path\nfrom typing import Any\nfrom zoneinfo import ZoneInfo\n\nfrom telegram import Update\nfrom telegram.ext import ContextTypes, JobQueue\n\nfrom todo_bot.formatting import format_list, pending_sorted\nfrom todo_bot.models import Task\nfrom todo_bot.parser import ParseError, parse_add_command\nfrom todo_bot.stats import cheer, format_stats\nfrom todo_bot.storage import load_tasks, save_tasks\n\nVN = ZoneInfo(\"Asia/Ho_Chi_Minh\")\nTASKS: list[Task] = []\nDATA_PATH = Path(\"tasks.json\")\n\nHELP = (\n    \"Chào bạn 👋\\n\"\n    \"Tạo việc: /add nội dung | HH:MM | lặp lại\\n\"\n    \"Ví dụ: /add Uống thuốc | 20:00 | hằng ngày\\n\"\n    \"Xem: /list · Xong: /done 1 · Xoá: /del 1 · Thống kê: /stats\"\n)\n\n\ndef load() -> None:\n    TASKS.clear()\n    TASKS.extend(Task.from_dict(d) for d in load_tasks(DATA_PATH))\n\n\ndef save() -> None:\n    save_tasks([t.to_dict() for t in TASKS], DATA_PATH)\n\n\ndef find(task_id: int) -> Task | None:\n    return next((t for t in TASKS if t.task_id == task_id), None)\n\n\ndef schedule(job_queue: JobQueue[Any], task: Task) -> None:\n    at = dt.time(task.at.hour, task.at.minute, tzinfo=VN)\n    name = str(task.task_id)\n    days = task.repeat.job_days()\n    if days is None:\n        now = dt.datetime.now(VN)\n        when = dt.datetime.combine(now.date(), at)\n        if when <= now:\n            when += dt.timedelta(days=1)\n        job_queue.run_once(remind, when, chat_id=task.chat_id, name=name, data=task.task_id)\n    else:\n        job_queue.run_daily(remind, at, days=days, chat_id=task.chat_id, name=name, data=task.task_id)\n\n\ndef unschedule(job_queue: JobQueue[Any], task: Task) -> None:\n    for job in job_queue.get_jobs_by_name(str(task.task_id)):\n        job.schedule_removal()\n\n\nasync def remind(context: ContextTypes.DEFAULT_TYPE) -> None:\n    job = context.job\n    if job is None or job.chat_id is None or not isinstance(job.data, int):\n        return\n    task = find(job.data)\n    if task is None or task.done:\n        return\n    await context.bot.send_message(job.chat_id, f\"⏰ {task.text}\")\n    if task.repeat.code == \"once\":\n        task.done = True\n        save()\n\n\nasync def start(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:\n    assert update.message is not None\n    await update.message.reply_text(HELP)\n\n\nasync def add(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:\n    assert update.message is not None and update.message.text is not None\n    try:\n        task = parse_add_command(update.message.text)\n    except ParseError as e:\n        await update.message.reply_text(f\"❌ {e}\")\n        return\n    if task in TASKS:\n        await update.message.reply_text(\"⚠️ Việc này đã có rồi\")\n        return\n    task.chat_id = update.effective_chat.id if update.effective_chat else None\n    task.task_id = max((t.task_id for t in TASKS), default=0) + 1\n    TASKS.append(task)\n    save()\n    if context.job_queue is not None:\n        schedule(context.job_queue, task)\n    await update.message.reply_text(f\"✅ Đã ghi: {task.text} lúc {task.at} ({task.repeat.describe()})\")\n\n\nasync def list_tasks(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:\n    assert update.message is not None\n    await update.message.reply_text(format_list(TASKS))\n\n\nasync def stats(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:\n    assert update.message is not None\n    await update.message.reply_text(format_stats([t.text for t in TASKS]))\n\n\ndef pick(args: list[str] | None) -> Task | None:\n    \"\"\"'/done 2' -> the 2nd task shown by /list, or None.\"\"\"\n    try:\n        number = int((args or [])[0])\n    except (ValueError, IndexError):\n        return None\n    todo = pending_sorted(TASKS)\n    return todo[number - 1] if 1 <= number <= len(todo) else None\n\n\nasync def done(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:\n    assert update.message is not None\n    task = pick(context.args)\n    if task is None:\n        await update.message.reply_text(\"❌ Dùng: /done số_thứ_tự (xem /list)\")\n        return\n    task.done = True\n    save()\n    if context.job_queue is not None:\n        unschedule(context.job_queue, task)\n    await update.message.reply_text(f\"{cheer()} Đã đánh dấu xong: {task.text}\")\n\n\nasync def delete(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:\n    assert update.message is not None\n    task = pick(context.args)\n    if task is None:\n        await update.message.reply_text(\"❌ Dùng: /del số_thứ_tự (xem /list)\")\n        return\n    TASKS.remove(task)\n    save()\n    if context.job_queue is not None:\n        unschedule(context.job_queue, task)\n    await update.message.reply_text(f\"🗑 Đã xoá: {task.text}\")", "lang": "python"}, {"t": ["", ""], "f": "bot/src/todo_bot/main.py", "act": "replace", "code": "from telegram.ext import Application, CommandHandler\n\nfrom todo_bot import config, handlers\n\n\ndef main() -> None:\n    handlers.load()\n    app = Application.builder().token(config.TOKEN).build()\n    app.add_handler(CommandHandler(\"start\", handlers.start))\n    app.add_handler(CommandHandler(\"add\", handlers.add))\n    app.add_handler(CommandHandler(\"list\", handlers.list_tasks))\n    app.add_handler(CommandHandler(\"done\", handlers.done))\n    app.add_handler(CommandHandler(\"del\", handlers.delete))\n    app.add_handler(CommandHandler(\"stats\", handlers.stats))\n    assert app.job_queue is not None\n    for task in handlers.TASKS:\n        if not task.done and task.chat_id is not None:\n            handlers.schedule(app.job_queue, task)\n    print(\"🤖 Bot đang chạy. Nhấn Ctrl+C để dừng.\")\n    app.run_polling()\n\n\nif __name__ == \"__main__\":\n    main()", "lang": "python", "run": "uv run mypy src/", "out": "Success: no issues found in 13 source files"}], "ut1": [{"t": ["Create the tests folder with an empty `__init__.py`, so commands like `python -m unittest tests.test_parser` work.", "Tạo thư mục tests với file `__init__.py` rỗng, để chạy được các lệnh như `python -m unittest tests.test_parser`."], "run": "mkdir -p tests\ntouch tests/__init__.py"}, {"t": ["Write the parser tests.", "Viết test cho parser."], "f": "bot/tests/test_parser.py", "act": "new", "code": "import unittest\n\nfrom todo_bot.models import Daily, Repeat, Weekly\nfrom todo_bot.parser import ParseError, parse_add_command\n\n\nclass TestParseAdd(unittest.TestCase):\n    def setUp(self) -> None:\n        self.cmd = \"/add Uống thuốc | 20:00 | hằng ngày\"\n\n    def test_parses_text_time_repeat(self) -> None:\n        task = parse_add_command(self.cmd)\n        self.assertEqual(task.text, \"Uống thuốc\")\n        self.assertEqual((task.at.hour, task.at.minute), (20, 0))\n        self.assertIsInstance(task.repeat, Daily)\n\n    def test_repeat_defaults_to_once(self) -> None:\n        task = parse_add_command(\"/add Gọi mẹ | 19:30\")\n        self.assertIs(type(task.repeat), Repeat)\n\n    def test_weekly_days(self) -> None:\n        task = parse_add_command(\"/add Họp | 09:00 | T2,T5\")\n        assert isinstance(task.repeat, Weekly)\n        self.assertEqual(task.repeat.days, {\"T2\", \"T5\"})\n        self.assertEqual(task.repeat.job_days(), (1, 4))\n\n    def test_rejects_bad_time(self) -> None:\n        with self.assertRaises(ParseError):\n            parse_add_command(\"/add Gọi mẹ | 25:99\")\n\n    def test_rejects_words_as_time(self) -> None:\n        with self.assertRaises(ParseError) as ctx:\n            parse_add_command(\"/add Đi chợ | 7h sáng\")\n        self.assertIn(\"7h sáng\", str(ctx.exception))\n\n    def test_rejects_unknown_repeat(self) -> None:\n        with self.assertRaises(ParseError):\n            parse_add_command(\"/add Họp | 09:00 | hằng tháng\")", "lang": "python"}, {"t": ["Run them.", "Chạy test."], "run": "uv run python -m unittest discover -s tests -v", "out": "test_parses_text_time_repeat (test_parser.TestParseAdd...) ... ok\ntest_rejects_bad_time (test_parser.TestParseAdd...) ... ok\n...\nRan 6 tests in 0.002s\n\nOK"}, {"t": ["**TDD exercise (red)**: support `ngày thường` = Monday to Friday. Write the test first, at the end of `TestParseAdd`, and run it: it fails.", "**Bài tập TDD (đỏ)**: hỗ trợ `ngày thường` = thứ Hai tới thứ Sáu. Viết test trước, ở cuối `TestParseAdd`, rồi chạy: test fail."], "f": "bot/tests/test_parser.py", "act": "add", "code": "    def test_weekdays_alias(self) -> None:\n        task = parse_add_command(\"/add Chấm công | 08:30 | ngày thường\")\n        self.assertEqual(task.repeat.describe(), \"mỗi T2, T3, T4, T5, T6\")", "lang": "python", "run": "uv run python -m unittest tests.test_parser", "out": "ERROR: test_weekdays_alias\ntodo_bot.parser.ParseError: Không hiểu kiểu lặp 'ngày thường'. ..."}, {"t": ["**Green**: add the smallest change in `make_repeat` (in `parser.py`), right after the `Daily()` branch. Run again: OK.", "**Xanh**: thêm thay đổi nhỏ nhất vào `make_repeat` (trong `parser.py`), ngay sau nhánh `Daily()`. Chạy lại: OK."], "f": "bot/src/todo_bot/parser.py", "act": "edit", "code": "    if w == \"ngày thường\":\n        return Weekly({\"T2\", \"T3\", \"T4\", \"T5\", \"T6\"})", "lang": "python", "run": "uv run python -m unittest tests.test_parser", "out": "Ran 7 tests in 0.002s\n\nOK"}], "ut2": [{"t": ["Test the Telegram module without the network: `patch` swaps `httpx.post` for a mock inside `todo_bot.telegram_api`.", "Test module Telegram mà không cần mạng: `patch` thay `httpx.post` bằng mock bên trong `todo_bot.telegram_api`."], "f": "bot/tests/test_telegram_api.py", "act": "new", "code": "import os\nimport unittest\nfrom unittest.mock import MagicMock, patch\n\nfrom todo_bot import telegram_api\n\n\nclass TestTelegramApi(unittest.TestCase):\n    @patch(\"todo_bot.telegram_api.httpx.post\")\n    def test_send_calls_send_message(self, mock_post: MagicMock) -> None:\n        mock_post.return_value.json.return_value = {\"ok\": True, \"result\": {\"message_id\": 1}}\n        telegram_api.send_message(\"hi\", chat_id=42)\n        url = mock_post.call_args.args[0]\n        self.assertTrue(url.endswith(\"/sendMessage\"))\n        self.assertEqual(mock_post.call_args.kwargs[\"json\"], {\"chat_id\": 42, \"text\": \"hi\"})\n\n    @patch(\"todo_bot.telegram_api.httpx.post\")\n    def test_error_raises(self, mock_post: MagicMock) -> None:\n        mock_post.return_value.json.return_value = {\"ok\": False, \"description\": \"Unauthorized\"}\n        with self.assertRaises(RuntimeError):\n            telegram_api.call(\"getMe\")\n\n    @unittest.skipUnless(os.environ.get(\"REAL_TELEGRAM\"), \"set REAL_TELEGRAM=1 to send a real message\")\n    def test_real_send(self) -> None:\n        telegram_api.send_message(\"🧪 integration test\")", "lang": "python"}, {"t": ["Test the handlers with fake `update` / `context` objects. `DATA_PATH` is patched so tests never touch your real `tasks.json`.", "Test handler với `update` / `context` giả. `DATA_PATH` được patch để test không bao giờ đụng vào `tasks.json` thật."], "f": "bot/tests/test_handlers.py", "act": "new", "code": "import tempfile\nimport unittest\nfrom pathlib import Path\nfrom unittest.mock import AsyncMock, MagicMock, patch\n\nfrom todo_bot import handlers\n\n\nclass TestHandlers(unittest.IsolatedAsyncioTestCase):\n    def setUp(self) -> None:\n        self.tmp = tempfile.TemporaryDirectory()\n        patcher = patch.object(handlers, \"DATA_PATH\", Path(self.tmp.name) / \"tasks.json\")\n        patcher.start()\n        self.addCleanup(patcher.stop)\n        self.addCleanup(self.tmp.cleanup)\n        handlers.TASKS.clear()\n\n    def make_update(self, text: str) -> MagicMock:\n        update = MagicMock()\n        update.message.text = text\n        update.message.reply_text = AsyncMock()\n        update.effective_chat.id = 111\n        return update\n\n    async def test_bad_time_replies_error(self) -> None:\n        update = self.make_update(\"/add Gọi mẹ | 25:00\")\n        await handlers.add(update, MagicMock())\n        reply = update.message.reply_text.call_args.args[0]\n        self.assertTrue(reply.startswith(\"❌\"))\n        self.assertEqual(handlers.TASKS, [])\n\n    async def test_add_saves_and_schedules(self) -> None:\n        update, context = self.make_update(\"/add Uống thuốc | 20:00 | hằng ngày\"), MagicMock()\n        await handlers.add(update, context)\n        self.assertEqual(len(handlers.TASKS), 1)\n        context.job_queue.run_daily.assert_called_once()\n        update.message.reply_text.assert_awaited_once()\n\n    async def test_done_by_list_number(self) -> None:\n        for cmd in [\"/add B | 20:00\", \"/add A | 07:00\"]:\n            await handlers.add(self.make_update(cmd), MagicMock())\n        update, context = self.make_update(\"/done 1\"), MagicMock()\n        context.args = [\"1\"]\n        await handlers.done(update, context)\n        a = next(t for t in handlers.TASKS if t.text == \"A\")\n        self.assertTrue(a.done)   # #1 in /list is the earliest task\n\n    async def test_done_zero_is_rejected(self) -> None:\n        await handlers.add(self.make_update(\"/add A | 07:00\"), MagicMock())\n        update, context = self.make_update(\"/done 0\"), MagicMock()\n        context.args = [\"0\"]\n        await handlers.done(update, context)\n        self.assertFalse(handlers.TASKS[0].done)", "lang": "python"}, {"t": ["Run everything. The real-send test is skipped by default.", "Chạy toàn bộ. Test gửi tin thật mặc định bị skip."], "run": "uv run python -m unittest discover -s tests -v", "out": "test_add_saves_and_schedules (test_handlers.TestHandlers...) ... ok\ntest_bad_time_replies_error (test_handlers.TestHandlers...) ... ok\n...\ntest_real_send (test_telegram_api.TestTelegramApi...) ... skipped 'set REAL_TELEGRAM=1 to send a real message'\nOK (skipped=1)"}, {"t": ["Run the integration test on purpose, once: it really sends a message.", "Chủ động chạy test tích hợp một lần: test này gửi tin nhắn thật."], "run": "REAL_TELEGRAM=1 uv run python -m unittest tests.test_telegram_api -v", "tg": [["bot", "🧪 integration test"]]}], "ut3": [{"t": ["Install Faker and look at what it generates.", "Cài Faker và xem nó sinh ra dữ liệu gì."], "run": "uv add --dev faker\nuv run python -c \"from faker import Faker; f = Faker('vi_VN'); print(f.name(), '|', f.sentence(nb_words=4))\" ", "out": "Hoàng Hữu Nguyễn | Như để.      (different every run)"}, {"t": ["Storage round-trip test with 20 fake tasks in a temporary folder.", "Test lưu rồi đọc lại 20 task giả trong thư mục tạm."], "f": "bot/tests/test_storage.py", "act": "new", "code": "import tempfile\nimport unittest\nfrom pathlib import Path\n\nfrom faker import Faker\n\nfrom todo_bot.models import TaskDict\nfrom todo_bot.storage import load_tasks, save_tasks\n\nfake = Faker(\"vi_VN\")\nFaker.seed(1234)\n\n\nclass TestStorage(unittest.TestCase):\n    def test_round_trip(self) -> None:\n        tasks: list[TaskDict] = [\n            {\"id\": i, \"text\": fake.sentence(nb_words=4),\n             \"hour\": fake.random_int(0, 23), \"minute\": fake.random_int(0, 59),\n             \"repeat\": fake.random_element([\"once\", \"daily\"]), \"days\": [],\n             \"chat_id\": 111, \"done\": False}\n            for i in range(20)\n        ]\n        with tempfile.TemporaryDirectory() as d:\n            path = Path(d) / \"tasks.json\"\n            save_tasks(tasks, path)\n            self.assertEqual(load_tasks(path), tasks)\n\n    def test_missing_file_is_empty(self) -> None:\n        self.assertEqual(load_tasks(Path(\"/nonexistent/tasks.json\")), [])", "lang": "python"}, {"t": ["Model tests, including the midnight edge case found by random data.", "Test cho model, gồm cả trường hợp qua nửa đêm mà dữ liệu ngẫu nhiên đã phát hiện."], "f": "bot/tests/test_models.py", "act": "new", "code": "import unittest\n\nfrom todo_bot.models import Daily, Repeat, Task, Time, Weekly\n\n\nclass TestTime(unittest.TestCase):\n    def test_add_wraps_past_midnight(self) -> None:\n        self.assertEqual(str(Time(23, 55) + 10), \"00:05\")\n\n    def test_add_rolls_hour(self) -> None:\n        self.assertEqual(str(Time(20, 50) + 15), \"21:05\")\n\n    def test_sorting(self) -> None:\n        self.assertEqual([str(t) for t in sorted([Time(20), Time(7, 30)])], [\"07:30\", \"20:00\"])\n\n\nclass TestRepeat(unittest.TestCase):\n    def test_describe(self) -> None:\n        self.assertEqual(Repeat().describe(), \"một lần\")\n        self.assertEqual(Daily().describe(), \"hằng ngày\")\n        self.assertEqual(Weekly({\"T5\", \"T2\"}).describe(), \"mỗi T2, T5\")\n\n\nclass TestTask(unittest.TestCase):\n    def test_dict_round_trip(self) -> None:\n        t = Task(\"Họp\", Time(9), Weekly({\"T2\"}), chat_id=1, task_id=3)\n        back = Task.from_dict(t.to_dict())\n        self.assertEqual(back, t)\n        self.assertEqual(back.repeat.describe(), \"mỗi T2\")", "lang": "python"}, {"t": ["Run the whole suite.", "Chạy toàn bộ bộ test."], "run": "uv run python -m unittest discover -s tests", "out": ".....................\n----------------------------------------------------------------------\nRan 21 tests in 0.03s\n\nOK (skipped=1)"}], "m4": [{"t": ["Make sure your files match the final versions from chapters I-4, T-1, T-2 and U-1 to U-3.", "Đảm bảo các file đã khớp với bản cuối ở các chương I-4, T-1, T-2 và U-1 tới U-3."]}, {"t": ["Type check.", "Kiểm tra type."], "run": "uv run mypy src/ tests/", "out": "Success: no issues found in 19 source files"}, {"t": ["Tests.", "Chạy test."], "run": "uv run python -m unittest discover -s tests", "out": "OK (skipped=1)"}, {"t": ["Prove it on a clean machine: clone into a temp folder, copy `.env`, sync, test, run.", "Chứng minh trên máy sạch: clone vào thư mục tạm, chép `.env`, sync, chạy test, chạy bot."], "run": "git clone <your-repo-url> /tmp/todo-check && cd /tmp/todo-check/bot\ncp ~/Documents/Training/python-todo-bot/bot/.env .\nuv sync\nuv run python -m unittest discover -s tests\nuv run todo-bot"}, {"t": ["Write the README: setup (BotFather, `.env`), commands, how to run tests. Commit and push.", "Viết README: cách cài (BotFather, `.env`), các lệnh của bot, cách chạy test. Commit và push."], "run": "git add . && git commit -m \"Bot v2.0: idiomatic, typed, tested\" && git push"}]}, "tips": {"setup": [["`'ok': False, 'error_code': 401, 'description': 'Unauthorized'`: the token in `.env` is wrong or has extra spaces.", "`'ok': False, 'error_code': 401, 'description': 'Unauthorized'`: token trong `.env` sai hoặc dính dấu cách."], ["`KeyError: 'TELEGRAM_TOKEN'`: `.env` is missing, misspelled, or not inside `bot/`.", "`KeyError: 'TELEGRAM_TOKEN'`: thiếu file `.env`, sai tên biến, hoặc file không nằm trong `bot/`."], ["\"Chưa có tin nhắn\": press Start / send any message to the bot, then run again. `getUpdates` only keeps the last 24 hours.", "\"Chưa có tin nhắn\": bấm Start hoặc nhắn bất kỳ gì cho bot rồi chạy lại. `getUpdates` chỉ giữ tin trong 24 giờ gần nhất."], ["`uv: command not found`: install uv first: `curl -LsSf https://astral.sh/uv/install.sh | sh`, then open a new terminal.", "`uv: command not found`: cài uv trước: `curl -LsSf https://astral.sh/uv/install.sh | sh`, rồi mở terminal mới."], ["Already have a `bot/` folder from Lesson 1 (`--no-package`)? Rename it to `bot-lesson1/` and start fresh so the layout matches.", "Đã có thư mục `bot/` từ Bài 1 (`--no-package`)? Đổi tên thành `bot-lesson1/` rồi tạo lại để cấu trúc khớp với hướng dẫn."], ["All later commands are run from inside `bot/`.", "Tất cả lệnh ở các chương sau đều chạy từ bên trong thư mục `bot/`."]], "tp03": [["`RuntimeError: sendMessage: Bad Request: chat not found`: `CHAT_ID` is wrong, or you never pressed Start in the bot chat.", "`RuntimeError: sendMessage: Bad Request: chat not found`: `CHAT_ID` sai, hoặc bạn chưa bấm Start trong khung chat với bot."], ["`ModuleNotFoundError: No module named 'todo_bot'`: you are not inside `bot/`, or the folder is not `src/todo_bot/`.", "`ModuleNotFoundError: No module named 'todo_bot'`: bạn không đứng trong `bot/`, hoặc thư mục không phải `src/todo_bot/`."]], "m3": [["`telegram.error.Conflict: terminated by other getUpdates request`: the bot is already running somewhere else (another terminal or server). Only one copy may poll.", "`telegram.error.Conflict: terminated by other getUpdates request`: bot đang chạy ở nơi khác (terminal khác hoặc server). Mỗi lúc chỉ được một bản chạy."], ["`telegram.error.InvalidToken: The token ... was rejected by the server`: fix `TELEGRAM_TOKEN` in `.env`.", "`telegram.error.InvalidToken: The token ... was rejected by the server`: sửa `TELEGRAM_TOKEN` trong `.env`."], ["Reminder arrives 7 hours late or early: `tzinfo=VN` is missing; JobQueue uses UTC by default.", "Lời nhắc tới sớm hoặc trễ 7 tiếng: thiếu `tzinfo=VN`; JobQueue mặc định dùng giờ UTC."], ["`AttributeError: 'NoneType' object has no attribute 'run_daily'`: install with `python-telegram-bot[job-queue]`, not plain `python-telegram-bot`.", "`AttributeError: 'NoneType' object has no attribute 'run_daily'`: phải cài `python-telegram-bot[job-queue]`, không phải bản thường."], ["The bot ignores you: it only reacts to the commands registered in `main.py`; plain text gets no reply.", "Bot không phản hồi: bot chỉ phản hồi các lệnh đã đăng ký trong `main.py`; tin nhắn chữ thường sẽ không được trả lời."]], "ut2": [["`KeyError: 'TELEGRAM_TOKEN'` while testing: `config.py` still needs `.env` to exist. On CI, set a dummy `TELEGRAM_TOKEN` environment variable.", "`KeyError: 'TELEGRAM_TOKEN'` khi chạy test: `config.py` vẫn cần file `.env`. Trên CI, đặt biến môi trường `TELEGRAM_TOKEN` giả."], ["A test file is ignored: its name must match `test*.py`.", "Một file test bị bỏ qua: tên file phải khớp mẫu `test*.py`."]]}, "act": {"new": ["Create file", "Tạo file mới"], "add": ["Add to the end of", "Thêm vào cuối"], "replace": ["Replace the whole file", "Thay toàn bộ file"], "edit": ["Edit", "Sửa trong"]}};

const termBlock = src => `<div class="code term"><div class="codebar"><span>${T(UI.term)}</span><button type="button" class="copy">${T(UI.copy)}</button></div><pre><code>${esc(src.trim())}</code></pre></div>`;
const bubbles = list => list.map(c => `<div class="bub ${c[0]}">${esc(c[1])}</div>`).join("");
function stepsHTML(id){
  const list = BOT.steps[id];
  if (!list) return "";
  const items = list.map((s, i) => {
    let h = `<li class="step"><span class="step-n">${i + 1}</span><div class="step-b">`;
    if (T(s.t)) h += `<p>${md(s.t)}</p>`;
    if (s.f) h += `<div class="file"><span class="file-act">${T(BOT.act[s.act || "edit"])}</span><code>${esc(s.f)}</code></div>`;
    if (s.code) h += codeBlock(s.code, s.lang || "python");
    if (s.run) h += termBlock(s.run);
    if (s.out) h += `<div class="out"><span>${T(UI.expected)}</span><pre>${esc(s.out)}</pre></div>`;
    if (s.tg) h += `<div class="out tgout"><span>${T(UI.onPhone)}</span><div class="chat mini">${bubbles(s.tg)}</div></div>`;
    return h + `</div></li>`;
  }).join("");
  const tips = BOT.tips[id] ? `<details class="tips"><summary>${T(UI.tipsH)}</summary><ul>${BOT.tips[id].map(t => `<li>${md(t)}</li>`).join("")}</ul></details>` : "";
  return `<ol class="steps">${items}</ol>${tips}`;
}

/* ---------- state ---------- */
let done = store.get("done", {});
let scores = store.get("scores", {});
let checks = store.get("checks", {});
let startDate = store.get("start", "2026-11-16");

const phaseOf = id => PHASES.find(p => p.id === id);
const idx = id => U.findIndex(u => u.id === id);

function workday(n){
  const [y,m,d] = startDate.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  while (dt.getDay() === 0 || dt.getDay() === 6) dt.setDate(dt.getDate()+1);
  let k = Math.max(n,1) - 1;
  while (k > 0){ dt.setDate(dt.getDate()+1); if (dt.getDay() !== 0 && dt.getDay() !== 6) k--; }
  if (n === 0){ /* day before day 1 */ }
  return dt;
}
const fmtDate = dt => dt.toLocaleDateString(LANG==="en"?"en-GB":"vi-VN", {weekday:"short", day:"2-digit", month:"2-digit"});
const dayLabel = n => n === 0 ? T(UI.before) : `${T(UI.day)} ${n} · ${fmtDate(workday(n))}`;

/* ---------- sidebar ---------- */
function renderSide(cur){
  let h = `<a class="ov" href="#overview" ${cur==="overview"?'aria-current="page"':""}>${T(UI.overview)}</a>`;
  for (const p of PHASES){
    const items = U.filter(u => u.ph === p.id);
    h += `<div class="phase-h t-${p.track}"><span class="dot"></span>${esc(T(p.t))}</div><ul>`;
    for (const u of items){
      const parts = [scores[u.id], scores[u.id + "~ex"]].filter(Boolean);
      const sc = parts.length ? [parts.reduce((x,p)=>x+p[0],0), (u.quiz?u.quiz.length:0) + (u.ex?u.ex.length:0)] : null;
      const st = done[u.id] ? `<span class="st done">✓</span>` : sc ? `<span class="st">${sc[0]}/${sc[1]}</span>` : "";
      h += `<li class="${u.prac?"prac":""}"><a href="#${u.id}" ${cur===u.id?'aria-current="page"':""}><span class="num">${esc(u.num)}</span><span class="lbl">${esc(T(u.t))}</span>${st}</a></li>`;
    }
    h += `</ul>`;
  }
  document.getElementById("side").innerHTML = h;
  const n = U.filter(u => done[u.id]).length;
  document.getElementById("progfill").style.width = (n / U.length * 100) + "%";
  document.getElementById("progtxt").textContent = `${n}/${U.length}`;
}

  const loop = [

    [["Review","Ôn"],["the key ideas and example here","ý chính và ví dụ trên trang này"]],

    ["v0.1",["One-shot script: parse `/add`, validate, send one Telegram message.","Script chạy một lần: tách lệnh `/add`, kiểm tra, gửi một tin Telegram."]],
    ["v0.2",["Tasks as dicts, saved to JSON; `/list` and `/stats`.","Task là dict, lưu JSON; có `/list` và `/stats`."]],
    ["v1.0",["Always-on bot with classes, JobQueue reminders in Vietnam time, `/done`, `/del`.","Bot chạy liên tục, dùng class, nhắc giờ bằng JobQueue theo giờ VN, có `/done`, `/del`."]],
    ["v2.0",["Same bot, now a typed, tested, idiomatic package.","Vẫn bot đó, nhưng là package có type, có test, viết chuẩn."]]

  return `
  <div class="hero">
    <div class="eyebrow"><span class="pill">Python 3.14</span><span>${T(["Rebuilt from the Agility IO training plan","Dựng lại từ plan training của Agility IO"])}</span></div>
    <h1>${LANG==="en" ? "From <em>print()</em> to a bot that reminds you" : "Từ <em>print()</em> tới con bot nhắc việc của bạn"}</h1>
    <p class="lede">${T(["Two tracks: Python fundamentals, then writing better Python. Every chapter ends with a short quiz, code-reading exercises and one concrete step on your Telegram todo bot, so each concept gets used as soon as you learn it.","Hai chặng: nền tảng Python, rồi viết Python tốt hơn. Mỗi chương kết thúc bằng quiz ngắn, bài tập đọc code và một bước làm bot Telegram nhắc việc, để học tới đâu dùng tới đó."])}</p>
    <div class="stats">
      <div><b>${nCh}</b><span>${T(UI.chapters)}</span></div>
      <div><b>${nQ}</b><span>${T(UI.quizzes)}</span></div>
      <div><b>4</b><span>${T(UI.botv)}</span></div>
    </div>
  </div>

  <section class="blk"><h2>${T(UI.how)}</h2><div class="loop">${loop}</div></section>
  <section class="blk"><h2>${T(UI.phasesH)}</h2><div class="phases">${phs}</div></section>
  <section class="blk"><h2>${T(UI.evoH)}</h2>
    <div class="bot"><div class="bot-h"><span class="avatar">N</span><div><b>Todo Bot</b><small>/add Uống thuốc | 20:00 | hằng ngày</small></div></div>
    <div class="bot-b evo">${evo}</div></div>
  </section>
  <section class="blk"><h2>${T(UI.matsH)}</h2><ul class="mats">
    <li><a href="https://allendowney.github.io/ThinkPython/index.html">Think Python, 3rd edition</a> — Allen B. Downey</li>
    <li><a href="${IDIOM}">Writing Idiomatic Python 3</a> — Jeff Knupp</li>
    <li><a href="https://docs.python.org/3/library/typing.html">typing</a> · <a href="https://mypy.readthedocs.io/">mypy</a> · <a href="https://docs.python.org/3/library/unittest.html">unittest</a> · <a href="https://docs.python.org/3/library/unittest.mock.html">unittest.mock</a> · <a href="https://pypi.org/project/Faker/">Faker</a></li>
    <li><a href="https://docs.python-telegram-bot.org/">python-telegram-bot</a> · <a href="https://core.telegram.org/bots/api">Telegram Bot API</a> · <a href="https://docs.astral.sh/uv/">uv</a></li>
  </ul>
  <p class="note" style="margin-top:1.4rem"><button type="button" class="btn" id="resetbtn">${T(UI.reset)}</button></p>
  </section>`;
}

/* ---------- unit ---------- */
const qCode = src => `<div class="code qcode"><pre><code>${hl(src.trim())}</code></pre></div>`;
function quizHTML(u, kind){
  const list = kind === "ex" ? u.ex : u.quiz;
  if (!list) return "";
  const qs = list.map((q,qi) => `<li class="q" data-q="${qi}"><p>${md(q.q)}</p>${q.c ? qCode(q.c) : ""}<div class="opts">${
    q.o.map((o,oi)=>`<button type="button" class="opt" data-o="${oi}"><span class="k">${"ABCD"[oi]}</span><span>${md(o)}</span></button>`).join("")
  }</div><p class="why" hidden></p></li>`).join("");
  const title = kind === "ex" ? T(UI.exTitle) : T(UI.quiz);
  const intro = kind === "ex" ? `<p class="note" style="margin:0 0 .8rem">${T(UI.exIntro)}</p>` : "";
  return `<section class="blk quiz ${kind}" id="quiz-${kind}"><div class="quiz-h"><h2>${title}</h2><span class="score">0/${list.length}</span></div>
    ${intro}<ol class="qs">${qs}</ol><div class="qend" hidden></div></section>`;
}
const scoreKey = (u, kind) => kind === "ex" ? u.id + "~ex" : u.id;

function renderUnit(u){
  const p = phaseOf(u.ph), i = idx(u.id), prev = U[i-1], next = U[i+1];
  const pillCls = u.prac ? "prac" : p.track === "better" ? "better" : p.track === "fund" ? "fund" : "";
  const srcs = (u.src||[]).map(s=>`<a class="src" href="${s[1]}">${T(UI.read)}: ${esc(s[0])} ↗</a>`).join(" · ");
  let h = `<div class="eyebrow"><span class="pill ${pillCls}">${esc(T(p.t))}</span>${srcs?`<span>${srcs}</span>`:""}</div>
    <h1 class="title">${esc(T(u.t))}</h1><p class="lede">${md(u.lede)}</p>`;

  if (u.prac){
    h += `<section class="blk"><h2><span class="h-ico">→</span>${T(UI.goal)}</h2><p style="max-width:68ch;margin:0">${md(u.goal)}</p></section>
      <section class="blk"><h2><span class="h-ico">✓</span>${T(UI.tasks)}</h2><ul class="check">${
        u.checks.map((c,ci)=>{ const key=u.id+":"+ci; return `<li><label for="ck-${u.id}-${ci}"><input type="checkbox" id="ck-${u.id}-${ci}" data-k="${key}" ${checks[key]?"checked":""}><span>${md(c[0])}<span class="uses">${T(UI.uses)}: ${esc(c[1])}</span></span></label></li>`; }).join("")
      }</ul></section>
      <section class="blk"><h2><span class="h-ico">tg</span>${T(UI.chat)}</h2>
        <div class="bot"><div class="bot-h"><span class="avatar">N</span><div><b>Todo Bot</b><small>${esc(T(u.t))}</small></div></div>
        <div class="chat">${u.chat.map(c=>`<div class="bub ${c[0]}">${esc(c[1])}</div>`).join("")}</div></div></section>
      <section class="blk"><h2><span class="h-ico">py</span>${BOT.steps[u.id] ? T(UI.stepsH) : T(UI.starter)}</h2>${BOT.steps[u.id] ? `<div class="bot"><div class="bot-b">${stepsHTML(u.id)}</div></div>` : codeBlock(u.code, u.codeLang||"python")}</section>
      <section class="blk"><h2><span class="h-ico">ok</span>${T(UI.dod)}</h2><p style="max-width:68ch;margin:0">${md(u.dod)}</p></section>`;
  } else {
    h += `<section class="blk"><h2><span class="h-ico">01</span>${T(UI.key)}</h2><ol class="points">${u.pts.map(x=>`<li><span>${md(x)}</span></li>`).join("")}</ol></section>
      <section class="blk"><h2><span class="h-ico">py</span>${T(UI.example)}</h2>${codeBlock(u.code, u.codeLang||"python")}</section>
      <section class="blk"><h2><span class="h-ico">tg</span>${T(UI.botTitle)}</h2>
        <div class="bot"><div class="bot-h"><span class="avatar">N</span><div><b>Todo Bot</b><small>${esc(T(p.ms).replace(/`/g,""))}</small></div></div>
        <div class="bot-b"><p>${md(u.bot)}</p>${BOT.steps[u.id] ? stepsHTML(u.id) : (u.botCode?codeBlock(u.botCode, u.botLang||"python"):"")}</div></div></section>`;
  }
  h += quizHTML(u, "quiz");
  h += quizHTML(u, "ex");
  h += `<div class="qend" style="margin-top:1.6rem"><button type="button" class="btn ${done[u.id]?"done":"primary"}" id="donebtn">${done[u.id]?T(UI.isDone):T(UI.markDone)}</button></div>`;
  h += `<nav class="pager">${prev?`<a href="#${prev.id}"><small>← ${T(UI.prev)}</small>${esc(T(prev.t))}</a>`:`<a href="#overview"><small>← ${T(UI.overview)}</small>${T(UI.overview)}</a>`}${next?`<a class="nx" href="#${next.id}"><small>${T(UI.next)} →</small>${esc(T(next.t))}</a>`:""}</nav>`;
  return h;
}

/* ---------- wiring ---------- */
function current(){ const h = location.hash.slice(1); return U.some(u=>u.id===h) ? h : "overview"; }
let resetArmed = false;

function render(scrollTop){
  const cur = current();
  document.documentElement.lang = LANG === "en" ? "en" : "vi";
  document.getElementById("lang-vi").setAttribute("aria-pressed", LANG==="vi");
  document.getElementById("lang-en").setAttribute("aria-pressed", LANG==="en");
  document.getElementById("navlbl").textContent = T(UI.contents);
  setSync(syncState);
  const view = document.getElementById("view");
  const u = U.find(x => x.id === cur);
  view.innerHTML = u ? renderUnit(u) : renderOverview();
  renderSide(cur);
  if (scrollTop) window.scrollTo(0,0);
  bindView(u);
}

function bindView(u){
  document.querySelectorAll(".copy").forEach(b => b.addEventListener("click", () => {
    const txt = b.closest(".code").querySelector("code").innerText;
    const ok = () => { b.textContent = T(UI.copied); setTimeout(()=>b.textContent = T(UI.copy), 1400); };
    try { navigator.clipboard.writeText(txt).then(ok).catch(()=>selectCode(b)); } catch(e){ selectCode(b); }
  }));
  const sd = document.getElementById("startdate");
  if (sd) sd.addEventListener("change", () => { if (sd.value){ startDate = sd.value; store.set("start", startDate); render(false); } });
  const rb = document.getElementById("resetbtn");
  if (rb) rb.addEventListener("click", () => {
    if (!resetArmed){ resetArmed = true; rb.textContent = T(UI.resetSure); setTimeout(()=>{ resetArmed=false; if (document.body.contains(rb)) rb.textContent = T(UI.reset); }, 3000); return; }
    done = {}; scores = {}; checks = {}; store.set("done", done); store.set("scores", scores); store.set("checks", checks); resetArmed = false; render(false);
  });
  document.querySelectorAll(".check input").forEach(c => c.addEventListener("change", () => { checks[c.dataset.k] = c.checked; store.set("checks", checks); }));
  const db = document.getElementById("donebtn");
  if (db && u) db.addEventListener("click", () => { done[u.id] = !done[u.id]; store.set("done", done); db.className = "btn " + (done[u.id]?"done":"primary"); db.textContent = done[u.id]?T(UI.isDone):T(UI.markDone); renderSide(u.id); });
  if (u && u.quiz) bindQuiz(u, "quiz");
  if (u && u.ex) bindQuiz(u, "ex");
}
function selectCode(b){ const r = document.createRange(); r.selectNodeContents(b.closest(".code").querySelector("code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

function bindQuiz(u, kind){
  const list = kind === "ex" ? u.ex : u.quiz, key = scoreKey(u, kind);
  const sec = document.getElementById("quiz-" + kind);
  const scoreEl = sec.querySelector(".score"), end = sec.querySelector(".qend");
  let answered = 0, correct = 0;
  sec.querySelectorAll(".q").forEach(qEl => {
    const q = list[+qEl.dataset.q];
    qEl.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      const pick = +btn.dataset.o, ok = pick === q.a;
      qEl.querySelectorAll(".opt").forEach((b,bi) => { b.disabled = true; if (bi === q.a) b.classList.add("right"); });
      if (!ok) btn.classList.add("wrong");
      const why = qEl.querySelector(".why");
      why.innerHTML = `<b class="${ok?"r":"w"}">${T(ok?UI.right:UI.wrong)}</b> ${md(q.w)}`;
      why.hidden = false;
      answered++; if (ok) correct++;
      scoreEl.textContent = `${correct}/${list.length}`;
      if (answered === list.length){
        const prevBest = scores[key] ? scores[key][0] : -1;
        if (correct > prevBest){ scores[key] = [correct, list.length]; store.set("scores", scores); renderSide(u.id); }
        end.hidden = false;
        end.innerHTML = `<span>${T(correct===list.length?UI.allright:UI.some)}</span><button type="button" class="btn retry">${T(UI.retry)}</button>`;
        end.querySelector(".retry").addEventListener("click", () => {
          sec.outerHTML = quizHTML(u, kind);
          bindQuiz(u, kind);
          document.getElementById("quiz-" + kind).scrollIntoView({block:"start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
        });
      }
    }));
  });
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { LANG = b.dataset.lang; store.set("lang", LANG); render(false); }));
const side = document.getElementById("side"), nt = document.getElementById("navtoggle");
nt.addEventListener("click", () => { const o = side.classList.toggle("open"); nt.setAttribute("aria-expanded", o); });
side.addEventListener("click", e => { if (e.target.closest("a")) { side.classList.remove("open"); nt.setAttribute("aria-expanded", "false"); } });
window.addEventListener("hashchange", () => render(true));

/* ---------- sync to claude.ai (per-viewer private doc), localStorage as cache ---------- */
let remote = null, syncState = (window.claude && window.claude.use) ? "wait" : "local";
let syncTimer = null, writing = Promise.resolve(), lastSent = "";
const stateBody = () => ({done, scores, checks, start: startDate, lang: LANG});
const hasLocalData = () => Object.keys(done).length || Object.keys(scores).length || Object.keys(checks).length;
function setSync(s){
  syncState = s;
  const el = document.getElementById("sync");
  if (el){ el.dataset.s = s; el.textContent = T(UI["sync_" + s]); el.title = T(UI["sync_" + s]); }
}
function scheduleSync(){
  if (!remote) return;
  clearTimeout(syncTimer);
  setSync("saving");
  syncTimer = setTimeout(() => pushRemote(true), 600);
}
function pushRemote(mayRetry){
  if (!remote) return;
  const body = stateBody(), js = JSON.stringify(body);
  if (js === lastSent){ setSync("cloud"); return; }
  writing = writing.then(() => remote.set(body)).then(() => {
    lastSent = js; setSync("cloud");
  }).catch(e => {
    if (mayRetry && e && e.code === "unavailable") setTimeout(() => pushRemote(false), 1200 + Math.random() * 1200);
    else setSync("err");
  });
}
function applyRemote(d){
  done = d.done || {}; scores = d.scores || {}; checks = d.checks || {};
  if (typeof d.start === "string") startDate = d.start;
  if (d.lang === "en" || d.lang === "vi") LANG = d.lang;
  store.local("done", done); store.local("scores", scores); store.local("checks", checks);
  store.local("start", startDate); store.local("lang", LANG);
}
async function initSync(){
  if (!(window.claude && window.claude.use)){ setSync("local"); return; }
  let db = null, user = null, id = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); id = user ? await user.id() : null; } catch(e){}
  if (!db || !id){ setSync("local"); return; }
  remote = db.doc("data/users/" + id + "/progress");
  let first = true;
  const timer = setTimeout(() => { if (first) setSync("err"); }, 10000);
  remote.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (!snap.exists){
      if (snap.metadata.fromCache || !first) return;
      first = false; clearTimeout(timer);
      if (hasLocalData()) pushRemote(true); else setSync("cloud");   // first visit: move browser progress up once
      return;
    }
    const d = snap.data();
    const js = JSON.stringify({done: d.done || {}, scores: d.scores || {}, checks: d.checks || {}, start: typeof d.start === "string" ? d.start : startDate, lang: (d.lang === "en" || d.lang === "vi") ? d.lang : LANG});
    if (js !== JSON.stringify(stateBody())){
      applyRemote(d);
      if (first || current() === "overview") render(false); else { renderSide(current()); setSync(syncState); }
    }
    lastSent = js;
    if (!snap.metadata.fromCache){ first = false; clearTimeout(timer); if (syncState !== "saving") setSync("cloud"); }
  }, () => { clearTimeout(timer); remote = null; setSync("err"); });
}

render(false);
initSync();
</script>
