<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Todo-Bot Roadmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar + left syllabus rail + one reading column. Two tracks colour-coded: Python blue (Fundamentals), Python yellow (Writing better Python). */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#E9EDF1; --ink:#14202B; --muted:#5B6976; --line:#D9E0E6;
  --blue:#2F5D8A; --blue-soft:#DCE7F2; --sun:#F2C230; --sun-soft:#FBF0C9; --sun-ink:#6B4E00;
  --ok:#1F7A4D; --ok-soft:#DDF1E6; --bad:#B3261E; --bad-soft:#F8E2E0;
  --code-bg:#13202C; --code-fg:#DCE6EF; --code-kw:#F2C230; --code-str:#9ED39A; --code-com:#7F93A6; --code-num:#F4A97E; --code-dec:#8FC3F0;
  --chat-bg:#DCE7F2; --bubble-me:#E3F4D6; --bubble-bot:#FFFFFF;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151E27; --sunk:#1B2530; --ink:#E4EAF0; --muted:#93A2AF; --line:#263240;
  --blue:#82B4E6; --blue-soft:#1C3047; --sun:#F2C230; --sun-soft:#3A3115; --sun-ink:#F5D46A;
  --ok:#62CC93; --ok-soft:#163326; --bad:#F2928A; --bad-soft:#3B1D1B;
  --code-bg:#0A1118; --code-fg:#DCE6EF; --chat-bg:#17283A; --bubble-me:#2B4A2A; --bubble-bot:#1F2D3B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151E27; --sunk:#1B2530; --ink:#E4EAF0; --muted:#93A2AF; --line:#263240;
  --blue:#82B4E6; --blue-soft:#1C3047; --sun:#F2C230; --sun-soft:#3A3115; --sun-ink:#F5D46A;
  --ok:#62CC93; --ok-soft:#163326; --bad:#F2928A; --bad-soft:#3B1D1B;
  --code-bg:#0A1118; --code-fg:#DCE6EF; --chat-bg:#17283A; --bubble-me:#2B4A2A; --bubble-bot:#1F2D3B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--blue);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:.08em .35em;border-radius:4px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:78rem;margin:0 auto;display:flex;align-items:center;gap:1rem;padding-block:.6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);min-width:0}
.logo{width:2rem;height:2rem;flex:none;border-radius:8px;background:var(--blue);display:grid;place-items:center;color:var(--surface);font-family:var(--mono);font-weight:600;font-size:.85rem}
.logo span{color:var(--sun)}
.brand b{font-family:var(--display);font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.prog{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-bar{width:6rem;height:.4rem;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--sunk)}
.lang button{border:0;background:none;padding:.25rem .7rem;border-radius:99px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.navtoggle{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.3rem .6rem;font-size:.85rem;cursor:pointer}
.sync{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="cloud"]::before{background:var(--ok)}
.sync[data-s="saving"]::before,.sync[data-s="wait"]::before{background:var(--sun)}
.sync[data-s="err"]::before{background:var(--bad)}
@media (max-width:1100px){.sync{font-size:0;gap:0}}
@media (max-width:640px){.prog-bar{display:none}.brand b{font-size:.95rem}}

/* shell */
.shell{max-width:78rem;margin:0 auto;display:grid;grid-template-columns:17.5rem minmax(0,1fr);gap:2.5rem;padding-block:1.5rem 4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.2rem);align-self:start;max-height:calc(100vh - 5.5rem);overflow:auto;padding-right:.3rem}
@media (max-width:920px){
  .shell{grid-template-columns:minmax(0,1fr);gap:1rem}
  .navtoggle{display:inline-block}
  .side{position:static;max-height:none;display:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem}
  .side.open{display:block}
}
.side a.ov{display:block;font-weight:600;text-decoration:none;color:var(--ink);padding:.45rem .6rem;border-radius:8px}
.phase-h{display:flex;align-items:center;gap:.5rem;margin:1rem 0 .25rem;padding:0 .6rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.dot{width:.55rem;height:.55rem;border-radius:2px;flex:none}
.t-setup .dot,.dot.t-setup{background:var(--muted)}
.t-fund .dot,.dot.t-fund{background:var(--blue)}
.t-better .dot,.dot.t-better{background:var(--sun)}
.side ul{list-style:none;margin:0;padding:0}
.side li a{display:flex;align-items:baseline;gap:.5rem;padding:.32rem .6rem;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.88rem;line-height:1.35}
.side li a:hover,.side a.ov:hover{background:var(--sunk)}
.side a[aria-current="page"]{background:var(--blue-soft);color:var(--ink)}
.side .num{font-family:var(--mono);font-size:.72rem;color:var(--muted);width:2.1rem;flex:none}
.side .lbl{flex:1;min-width:0}
.side .st{font-size:.7rem;font-family:var(--mono);color:var(--muted);flex:none}
.side .st.done{color:var(--ok)}
.side li.prac a .lbl{font-weight:600}

/* main */
main{min-width:0;max-width:48rem}
.eyebrow{display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:.6rem}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.12rem .55rem;border-radius:99px;background:var(--sunk);font-size:.75rem;font-weight:600;color:var(--ink)}
.pill.fund{background:var(--blue-soft)}
.pill.better{background:var(--sun-soft);color:var(--sun-ink)}
.pill.prac{background:var(--ok-soft);color:var(--ok)}
h1.title{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.01em;margin-bottom:.4rem}
.lede{color:var(--muted);font-size:1.05rem;max-width:62ch;margin:0 0 1.6rem}
section.blk{margin-top:2.2rem}
section.blk>h2{font-size:1.25rem;font-weight:700;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem}
.h-ico{font-family:var(--mono);font-size:.75rem;font-weight:600;color:var(--surface);background:var(--ink);border-radius:5px;padding:.1rem .4rem}
.points{list-style:none;padding:0;margin:0;display:grid;gap:.7rem}
.points li{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.4rem;max-width:68ch}
.points li::before{content:counter(pt);counter-increment:pt;font-family:var(--mono);font-size:.75rem;color:var(--blue);font-weight:600;padding-top:.2rem}
.points{counter-reset:pt}
.src{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem}

/* code */
.code{border-radius:10px;background:var(--code-bg);color:var(--code-fg);overflow:hidden;margin:.6rem 0}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:.35rem .8rem;font-family:var(--mono);font-size:.72rem;color:var(--code-com);border-bottom:1px solid rgb(255 255 255 / .06)}
.codebar button{background:none;border:1px solid rgb(255 255 255 / .15);color:var(--code-fg);border-radius:6px;font-size:.72rem;padding:.1rem .5rem;cursor:pointer}
.code pre{margin:0;padding:.9rem 1rem;overflow-x:auto;font-family:var(--mono);font-size:.82rem;line-height:1.6}
.code code{background:none;padding:0;font-size:inherit;color:inherit}
.tk-k{color:var(--code-kw)}.tk-s{color:var(--code-str)}.tk-c{color:var(--code-com);font-style:italic}.tk-n{color:var(--code-num)}.tk-d{color:var(--code-dec)}

/* bot practice */
.bot{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.bot-h{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;background:var(--chat-bg)}
.avatar{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:var(--surface);font-weight:700;font-family:var(--display);flex:none}
.bot-h small{display:block;color:var(--muted);font-size:.75rem;line-height:1.2}
.bot-b{padding:1rem}
.bot-b p{margin:0 0 .6rem;max-width:68ch}
.chat{background:var(--chat-bg);padding:1rem;display:flex;flex-direction:column;gap:.45rem}
.bub{max-width:min(85%,26rem);padding:.45rem .75rem;border-radius:12px;font-size:.9rem;white-space:pre-wrap;line-height:1.45;box-shadow:0 1px 1px rgb(0 0 0 / .08)}
.bub.me{align-self:flex-end;background:var(--bubble-me);border-bottom-right-radius:4px;font-family:var(--mono);font-size:.8rem}
.bub.bot{align-self:flex-start;background:var(--bubble-bot);border-bottom-left-radius:4px}
.bub.sys{align-self:center;background:none;box-shadow:none;color:var(--muted);font-size:.75rem;padding:0}

/* quiz */
.quiz{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:1.1rem 1.1rem 1.2rem}
.quiz-h{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.4rem}
.quiz-h h2{font-size:1.2rem}
.score{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.qs{list-style:none;margin:0;padding:0;display:grid;gap:1.2rem;counter-reset:q}
.q>p{margin:.2rem 0 .55rem;font-weight:600}
.q>p::before{counter-increment:q;content:"Q" counter(q) "  ";font-family:var(--mono);color:var(--blue);font-size:.8rem}
.opts{display:grid;gap:.4rem}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:.5rem .75rem;cursor:pointer;display:flex;gap:.6rem;align-items:baseline;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{font-family:var(--mono);font-size:.75rem;color:var(--muted);flex:none}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.qcode{margin:.2rem 0 .6rem}.qcode pre{font-size:.78rem;padding:.7rem .9rem}
.quiz.ex{margin-top:1.2rem}
.steps{list-style:none;padding:0;margin:.9rem 0 0;display:grid;gap:1.3rem}
.step{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:.7rem}
.step-n{width:1.8rem;height:1.8rem;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:600}
.step-b{min-width:0}
.step-b>p{margin:.2rem 0 .5rem;max-width:68ch}
.file{display:flex;flex-wrap:wrap;gap:.45rem;align-items:baseline;font-size:.8rem;margin:.4rem 0 -.1rem}
.file-act{font-weight:600;color:var(--muted)}
.file code{background:var(--sun-soft);color:var(--sun-ink);font-weight:600}
.code.term .codebar{color:var(--code-str)}
.out{border:1px dashed var(--line);border-radius:10px;padding:.5rem .8rem;margin:.5rem 0}
.out>span{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.out pre{margin:.3rem 0 0;font-family:var(--mono);font-size:.78rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.chat.mini{border-radius:8px;margin-top:.4rem;padding:.7rem}
details.tips{margin-top:1.3rem;border:1px solid var(--line);border-radius:10px;padding:.6rem .9rem;background:var(--bg)}
details.tips summary{cursor:pointer;font-weight:600}
details.tips ul{margin:.6rem 0 .2rem;padding-left:1.2rem;display:grid;gap:.4rem;font-size:.9rem}
.why{margin:.5rem 0 0;font-size:.9rem;padding:.5rem .75rem;border-radius:8px;background:var(--sunk)}
.why b.r{color:var(--ok)}.why b.w{color:var(--bad)}
.qend{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:.5rem .9rem;cursor:pointer;font-weight:600;font-size:.9rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.btn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pager{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--line)}
.pager a{flex:1 1 14rem;min-width:0;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.6rem .9rem;background:var(--surface)}
.pager a:hover{border-color:var(--blue)}
.pager small{display:block;color:var(--muted);font-size:.75rem}
.pager a.nx{text-align:right}

/* checklist */
.check{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.check label{display:grid;grid-template-columns:1.3rem minmax(0,1fr);gap:.5rem;align-items:start;padding:.5rem .7rem;border-radius:9px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.check input{margin:.25rem 0 0;accent-color:var(--ok)}
.check .uses{display:block;font-size:.75rem;color:var(--muted);font-family:var(--mono)}

/* overview */
.hero{padding:.4rem 0 .2rem}
.hero h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--sun) 62%);padding:0 .1em}
.stats{display:flex;flex-wrap:wrap;gap:1.6rem;margin:1.2rem 0 0}
.stats div{min-width:5.5rem}
.stats b{display:block;font-family:var(--display);font-size:1.8rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.startrow{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1.4rem;font-size:.9rem}
.startrow input{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:.3rem .5rem}
.timeline{display:flex;gap:3px;margin:1.4rem 0 .4rem;height:2.6rem}
.timeline a{display:flex;align-items:flex-end;padding:.3rem .4rem;border-radius:6px;text-decoration:none;font-size:.7rem;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;color:var(--ink)}
.timeline a.t-fund{background:var(--blue-soft)}
.timeline a.t-better{background:var(--sun-soft);color:var(--sun-ink)}
.tl-legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.tl-legend span{display:inline-flex;align-items:center;gap:.35rem}
.phases{display:grid;gap:.8rem;margin-top:1rem}
.ph{display:block;padding:.9rem 1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
.ph:hover{border-color:var(--blue)}
.ph .when{font-family:var(--mono);font-size:.75rem;color:var(--muted);line-height:1.4}
.ph .when b{display:block;font-size:.95rem;color:var(--ink)}
.ph h3{font-size:1.05rem;display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.ph p{margin:.25rem 0 0;font-size:.88rem;color:var(--muted)}
.ph .ms{margin-top:.45rem;font-size:.82rem;display:flex;gap:.4rem;align-items:baseline}
.ph .ms code{font-size:.78rem}
.ph .bar{height:4px;border-radius:9px;background:var(--sunk);margin-top:.6rem;overflow:hidden}
.ph .bar i{display:block;height:100%;background:var(--ok)}
.loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.6rem;margin-top:.4rem}
.loop div{border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;background:var(--surface);font-size:.85rem}
.loop b{display:block;font-family:var(--display);font-size:.95rem;margin-bottom:.15rem}
.loop .n{font-family:var(--mono);font-size:.72rem;color:var(--blue)}
.evo{display:grid;gap:0;margin-top:.4rem}
.evo div{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:.8rem;padding:.55rem 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.evo b{font-family:var(--mono);font-size:.8rem;color:var(--blue)}
.mats{display:grid;gap:.4rem;padding:0;margin:0;list-style:none;font-size:.9rem}
.note{font-size:.85rem;color:var(--muted);max-width:68ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#overview"><span class="logo">py<span>›</span></span><b id="brandname">Python Todo-Bot Roadmap</b></a>
    <span class="spacer"></span>
    <button class="navtoggle" id="navtoggle" type="button" aria-expanded="false">☰ <span id="navlbl">Mục lục</span></button>
    <span class="sync" id="sync" data-s="wait" role="status"></span>
    <div class="prog" title="progress"><span class="prog-bar"><i id="progfill"></i></span><span id="progtxt">0/0</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-vi" data-lang="vi" aria-pressed="true">VN</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Syllabus"></nav>
  <main id="view"></main>
</div>

<script>
/* ---------- tiny helpers ---------- */
const SYNC_KEYS = ["done","scores","checks","start","lang"];
const store = {
  get(k, d){ try{ const v = localStorage.getItem("ptb:"+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  local(k, v){ try{ localStorage.setItem("ptb:"+k, JSON.stringify(v)); }catch(e){} },
  set(k, v){ this.local(k, v); if (SYNC_KEYS.includes(k)) scheduleSync(); }
};
let LANG = store.get("lang", "vi");
const T = x => (x == null ? "" : typeof x === "string" ? x : (LANG === "en" ? x[0] : x[1]));
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const md = s => esc(T(s)).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
function hl(src){
  const re = /(#[^\n]*)|("""[\s\S]*?"""|[rbf]{0,2}"(?:\\.|[^"\\\n])*"|[rbf]{0,2}'(?:\\.|[^'\\\n])*')|(@[\w.]+)|\b(def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|with|try|except|finally|raise|lambda|yield|None|True|False|pass|break|continue|is|async|await|type|assert|self)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out = "", last = 0, m;
  while((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "d" : m[4] ? "k" : "n";
    out += `<span class="tk-${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;

def is_valid_time(hour, minute):
    return 0 <= hour < 24 and 0 <= minute < 60

def minutes_until(now_h, now_m, at_h, at_m):
    diff = (at_h * 60 + at_m) - (now_h * 60 + now_m)
    return diff % (24 * 60)          # wraps past midnight

assert is_valid_time(20, 0)
assert minutes_until(23, 0, 1, 0) == 120`,

def parse_add(cmd):
    parts = cmd.removeprefix("/add").split("|")
    if len(parts) < 2:
        return None, "Cú pháp: /add nội dung | HH:MM | lặp lại"
    m = re.fullmatch(r"(\d{1,2}):(\d{2})", parts[1].strip())

def word_counts(tasks):
    counts = {}
    for task in tasks:
        for word in task.lower().split():
            counts[word] = counts.get(word, 0) + 1
    return counts

def top(counts, n=3):
    return sorted(counts.items(), key=lambda kv: kv[1], reverse=True)[:n]`,

class Time:
    def __init__(self, hour=0, minute=0):
        self.hour = hour
        self.minute = minute

    def __str__(self):
        return f"{self.hour:02d}:{self.minute:02d}"

    def __add__(self, minutes):
        total = self.hour * 60 + self.minute + minutes
        return Time(total // 60 % 24, total % 60)

    def __lt__(self, other):
        return (self.hour, self.minute) < (other.hour, other.minute)

    @staticmethod
    def parse(s):
        h, m = s.split(":")
        return Time(int(h), int(m))`,
 bot:["Replace the hour/minute pair everywhere with `Time`. Sorting tasks now just works because of `__lt__`.","Thay cặp hour/minute ở mọi chỗ bằng `Time`. Nhờ `__lt__`, sắp xếp task tự chạy đúng."],

    label = "một lần"                 # class attribute
    def describe(self):
        return self.label

class Daily(Repeat):
    label = "hằng ngày"

class Weekly(Repeat):

        super().__init__()
        self.days = days              # e.g. {"T2", "T5"}
    def describe(self):
        return "mỗi " + ", ".join(sorted(self.days))

for rule in [Repeat(), Daily(), Weekly({"T2", "T5"})]:

import datetime as dt
from zoneinfo import ZoneInfo
from telegram.ext import Application, CommandHandler

VN = ZoneInfo("Asia/Ho_Chi_Minh")

async def remind(context):
    await context.bot.send_message(context.job.chat_id, f"⏰ {context.job.data}")

async def add(update, context):
    task = parse_add_command(update.message.text)        # from Practice #1
    context.job_queue.run_daily(
        remind,
        time=dt.time(task.at.hour, task.at.minute, tzinfo=VN),
        chat_id=update.effective_chat.id,
        data=task.text,
    )
    await update.message.reply_text(f"✅ Đã ghi: {task.text} lúc {task.at}")

def main():
    app = Application.builder().token(TOKEN).build()
    app.add_handler(CommandHandler("add", add))
    app.run_polling()

if __name__ == "__main__":
    main()`,

from collections.abc import Callable

type HourMinute = tuple[int, int]

def parse_time(s: str) -> HourMinute | None:
    h, sep, m = s.partition(":")
    if not (sep and h.isdigit() and m.isdigit()):
        return None
    return int(h), int(m)

def first[T](items: list[T]) -> T | None:
    return items[0] if items else None

type Formatter = Callable[[str, int, int], str]

const BOT = {"steps": {"setup": [{"t": ["In Telegram, search **@BotFather** (blue check mark), tap Start, send `/newbot`. Give it a display name (e.g. `Quan Todo`), then a username that ends in `bot` (e.g. `quan_todo_bot`). BotFather replies with a **token** like `8123456789:AAH...`. Treat it like a password.", "Trong Telegram, tìm **@BotFather** (có dấu tích xanh), bấm Start, gửi `/newbot`. Đặt tên hiển thị (ví dụ `Quan Todo`), rồi đặt username kết thúc bằng `bot` (ví dụ `quan_todo_bot`). BotFather trả về một **token** dạng `8123456789:AAH...`. Coi nó như mật khẩu, không gửi cho ai."], "tg": [["me", "/newbot"], ["bot", "Alright, a new bot. How are we going to call it?"], ["me", "Quan Todo"], ["bot", "Good. Now let's choose a username for your bot. It must end in `bot`."], ["me", "quan_todo_bot"], ["bot", "Done! ... Use this token to access the HTTP API:\n8123456789:AAH…"]]}, {"t": ["Open your new bot (tap the `t.me/quan_todo_bot` link BotFather sent) and press **Start**. A bot can only message people who messaged it first.", "Mở bot vừa tạo (bấm link `t.me/quan_todo_bot` BotFather gửi) và bấm **Start**. Bot chỉ được nhắn cho người đã từng nhắn nó trước."]}, {"t": ["Create the project. Run these from the repo root. `--package` gives a `src/` layout so later chapters can import modules and write tests.", "Tạo dự án. Chạy các lệnh sau từ thư mục gốc của repo. `--package` tạo cấu trúc `src/` để các chương sau import module và viết test dễ dàng."], "run": "cd ~/Documents/Training/python-todo-bot\nuv init --package --name todo-bot --python 3.14 bot\ncd bot\nuv add httpx python-dotenv", "out": "bot/\n├── pyproject.toml\n├── uv.lock\n├── .python-version\n├── README.md\n└── src/todo_bot/__init__.py"}, {"t": ["Create `bot/.env` with your token. Leave `CHAT_ID` empty for now.", "Tạo file `bot/.env` chứa token. Để trống `CHAT_ID`, lát nữa điền."], "f": "bot/.env", "act": "new", "code": "TELEGRAM_TOKEN=8123456789:AAH-dán-token-thật-vào-đây\nCHAT_ID=", "lang": "env"}, {"t": ["Make sure secrets and personal data never reach Git: add these lines to the repo's `.gitignore`, then check that `git status` does not list `.env`.", "Đảm bảo bí mật và dữ liệu cá nhân không lên Git: thêm các dòng này vào `.gitignore` của repo, rồi kiểm tra `git status` không còn thấy `.env`."], "f": ".gitignore", "act": "add", "code": ".env\ntasks.json\n.venv/", "lang": "text", "run": "git status --short"}, {"t": ["Create a small check script. It asks Telegram who your bot is (`getMe`) and finds your chat id from the messages the bot received (`getUpdates`). You can copy it as-is; every line is explained in later chapters.", "Tạo một script kiểm tra nhỏ. Script hỏi Telegram bot của bạn là ai (`getMe`) và tìm chat id của bạn trong các tin bot đã nhận (`getUpdates`). Cứ copy nguyên văn; từng dòng sẽ được giải thích ở các chương sau."], "f": "bot/src/todo_bot/check.py", "act": "new", "code": "import os\n\nimport httpx\nfrom dotenv import load_dotenv\n\nload_dotenv()  # reads bot/.env\napi = \"https://api.telegram.org/bot\" + os.environ[\"TELEGRAM_TOKEN\"]\n\nme = httpx.get(api + \"/getMe\").json()\nprint(\"Bot:\", me)\n\nupdates = httpx.get(api + \"/getUpdates\").json()[\"result\"]\nchats = [u[\"message\"][\"chat\"][\"id\"] for u in updates if \"message\" in u]\nif chats:\n    print(\"CHAT_ID =\", chats[-1])\nelse:\n    print(\"Chưa có tin nhắn. Mở bot trên Telegram, bấm Start rồi chạy lại.\")", "lang": "python", "run": "uv run python -m todo_bot.check", "out": "Bot: {'ok': True, 'result': {'id': 8123456789, 'is_bot': True, 'first_name': 'Quan Todo', 'username': 'quan_todo_bot', ...}}\nCHAT_ID = 987654321"}, {"t": ["Copy the number into `.env`, then commit the project.", "Chép số đó vào `.env`, rồi commit dự án."], "f": "bot/.env", "act": "edit", "code": "TELEGRAM_TOKEN=8123456789:AAH...\nCHAT_ID=987654321", "lang": "env", "run": "git add bot .gitignore\ngit commit -m \"Set up todo bot project\" "}], "tp01": [{"t": ["Open the Python REPL inside the project. It works like `node` without arguments.", "Mở Python REPL trong dự án, giống gõ `node` không kèm file."], "run": "uv run python"}, {"t": ["Type these lines one by one after the `>>>` prompt.", "Gõ từng dòng sau dấu nhắc `>>>`."], "code": "reminder = 20 * 60 + 30\nnow = 18 * 60 + 5\nleft = reminder - now\nleft // 60, left % 60", "lang": "python", "out": "(2, 25)"}, {"t": ["Leave the REPL with `exit()` or Ctrl+D.", "Thoát REPL bằng `exit()` hoặc Ctrl+D."]}], "tp02": [{"t": ["Create a config module. Every other module will import the token from here instead of reading `.env` itself.", "Tạo module cấu hình. Mọi module khác sẽ lấy token từ đây thay vì tự đọc `.env`."], "f": "bot/src/todo_bot/config.py", "act": "new", "code": "import os\n\nfrom dotenv import load_dotenv\n\nload_dotenv()  # reads bot/.env into os.environ (like process.env)\n\nTOKEN = os.environ[\"TELEGRAM_TOKEN\"]   # KeyError if missing: fail fast\nCHAT_ID = os.environ.get(\"CHAT_ID\")     # None if missing", "lang": "python"}, {"t": ["Check it reads your `.env`.", "Kiểm tra module đọc được `.env`."], "run": "uv run python -c \"from todo_bot import config; print(config.CHAT_ID)\" ", "out": "987654321"}, {"t": ["See the failure on purpose: put `#` in front of the `TELEGRAM_TOKEN` line in `.env`, run the same command, then remove the `#` again.", "Thử làm lỗi: thêm `#` trước dòng `TELEGRAM_TOKEN` trong `.env`, chạy lại lệnh trên, rồi bỏ `#` đi."], "out": "KeyError: 'TELEGRAM_TOKEN'"}], "tp03": [{"t": ["Create the Telegram module. `call()` wraps the Bot API rule: POST to `.../bot<token>/<method>`, get back `{ok, result}`.", "Tạo module Telegram. `call()` bọc đúng quy ước của Bot API: POST tới `.../bot<token>/<method>`, nhận về `{ok, result}`."], "f": "bot/src/todo_bot/telegram_api.py", "act": "new", "code": "import httpx\n\nfrom todo_bot import config\n\nAPI = f\"https://api.telegram.org/bot{config.TOKEN}\"\n\n\ndef call(method, **params):\n    \"\"\"Call one Bot API method and return its result.\"\"\"\n    r = httpx.post(f\"{API}/{method}\", json=params, timeout=10)\n    data = r.json()\n    if not data[\"ok\"]:\n        raise RuntimeError(f\"{method}: {data['description']}\")\n    return data[\"result\"]\n\n\ndef send_message(text, chat_id=None):\n    return call(\"sendMessage\", chat_id=chat_id or config.CHAT_ID, text=text)", "lang": "python"}, {"t": ["Create a formatting module with `format_task`.", "Tạo module định dạng với hàm `format_task`."], "f": "bot/src/todo_bot/formatting.py", "act": "new", "code": "def format_task(text, hour, minute):\n    label = f\"{hour:02d}:{minute:02d}\"\n    return f\"⏰ {label} — {text}\"", "lang": "python"}, {"t": ["Send yourself a reminder-looking message.", "Gửi cho chính bạn một tin nhắn dạng lời nhắc."], "run": "uv run python -c \"from todo_bot.telegram_api import send_message; from todo_bot.formatting import format_task; send_message(format_task('Uống thuốc', 20, 0))\" ", "tg": [["bot", "⏰ 20:00 — Uống thuốc"]]}, {"t": ["Commit.", "Commit."], "run": "git add . && git commit -m \"Add send_message and format_task\" "}], "tp05": [{"t": ["Create a time module with the validation function.", "Tạo module thời gian với hàm kiểm tra giờ."], "f": "bot/src/todo_bot/timeutils.py", "act": "new", "code": "def time_error(hour, minute):\n    \"\"\"Return an error message, or None when the time is valid.\"\"\"\n    if not 0 <= hour < 24:\n        return f\"Giờ {hour} không hợp lệ (0–23)\"\n    elif not 0 <= minute < 60:\n        return f\"Phút {minute} không hợp lệ (0–59)\"\n    return None", "lang": "python"}, {"t": ["Try a bad and a good time.", "Thử một giờ sai và một giờ đúng."], "run": "uv run python -c \"from todo_bot.timeutils import time_error; print(time_error(25, 0)); print(time_error(20, 0))\" ", "out": "Giờ 25 không hợp lệ (0–23)\nNone"}], "tp06": [{"t": ["Add two functions to the end of the same file.", "Thêm hai hàm vào cuối cùng file đó."], "f": "bot/src/todo_bot/timeutils.py", "act": "add", "code": "def is_valid_time(hour, minute):\n    return time_error(hour, minute) is None\n\n\ndef minutes_until(now_h, now_m, at_h, at_m):\n    diff = (at_h * 60 + at_m) - (now_h * 60 + now_m)\n    return diff % (24 * 60)          # wraps past midnight", "lang": "python"}, {"t": ["Check the midnight case: 23:30 → 07:00 is 7.5 hours.", "Kiểm tra trường hợp qua nửa đêm: 23:30 → 07:00 là 7,5 giờ."], "run": "uv run python -c \"from todo_bot.timeutils import minutes_until as m; print(m(23, 30, 7, 0), m(18, 5, 20, 30))\" ", "out": "450 145"}], "tp07": [{"t": ["Create the finder module with a doctest in its docstring.", "Tạo module tìm kiếm, kèm doctest trong docstring."], "f": "bot/src/todo_bot/finder.py", "act": "new", "code": "def find_task(tasks, keyword):\n    \"\"\"Return the first task containing keyword, or None.\n\n    >>> find_task([\"Gọi mẹ\", \"Đi chợ\"], \"chợ\")\n    'Đi chợ'\n    >>> find_task([\"Gọi mẹ\"], \"Nam\") is None\n    True\n    \"\"\"\n    for task in tasks:\n        if keyword.lower() in task.lower():\n            return task\n    return None", "lang": "python"}, {"t": ["Run the doctests. With `-v` you see each example; without it, silence means everything passed.", "Chạy doctest. Có `-v` thì thấy từng ví dụ; không có `-v` mà không in gì nghĩa là đã qua hết."], "run": "uv run python -m doctest -v src/todo_bot/finder.py", "out": "...\n2 passed.\nTest passed."}, {"t": ["Break it on purpose: change `'Đi chợ'` in the docstring to `'Đi chợ!'` and run again to see a failure report. Then change it back.", "Thử làm hỏng: sửa `'Đi chợ'` trong docstring thành `'Đi chợ!'` rồi chạy lại để xem báo lỗi. Xong thì sửa lại như cũ."], "out": "Failed example:\n    find_task([\"Gọi mẹ\", \"Đi chợ\"], \"chợ\")\nExpected:\n    'Đi chợ!'\nGot:\n    'Đi chợ'"}], "tp08": [{"t": ["Create the parser. It returns a pair `(task, error)`: exactly one of them is `None`.", "Tạo bộ tách lệnh. Hàm trả về cặp `(task, error)`: luôn có đúng một trong hai là `None`."], "f": "bot/src/todo_bot/parser.py", "act": "new", "code": "import re\n\nfrom todo_bot.timeutils import time_error\n\nTIME_RE = r\"(\\d{1,2}):(\\d{2})\"\n\n\ndef parse_add(cmd):\n    \"\"\"'/add Uống thuốc | 20:00 | hằng ngày' -> ((text, hour, minute, repeat), None)\n    On bad input -> (None, error message).\"\"\"\n    parts = cmd.removeprefix(\"/add\").split(\"|\")\n    if len(parts) < 2:\n        return None, \"Cú pháp: /add nội dung | HH:MM | lặp lại\"\n    text = parts[0].strip()\n    at = parts[1].strip()\n    if not text:\n        return None, \"Thiếu nội dung việc cần làm\"\n    m = re.fullmatch(TIME_RE, at)\n    if not m:\n        return None, f\"Không hiểu giờ '{at}'. Dùng dạng HH:MM, ví dụ 07:00\"\n    hour, minute = int(m.group(1)), int(m.group(2))\n    error = time_error(hour, minute)\n    if error:\n        return None, error\n    repeat = parts[2].strip() if len(parts) > 2 else \"một lần\"\n    return (text, hour, minute, repeat), None", "lang": "python"}, {"t": ["Try a good command, a bad time and a missing time.", "Thử một lệnh đúng, một giờ sai và một lệnh thiếu giờ."], "run": "uv run python -c \"from todo_bot.parser import parse_add; print(parse_add('/add Uống thuốc | 20:00 | hằng ngày')); print(parse_add('/add Gọi mẹ | 25:00')); print(parse_add('/add Đi chợ'))\" ", "out": "(('Uống thuốc', 20, 0, 'hằng ngày'), None)\n(None, 'Giờ 25 không hợp lệ (0–23)')\n(None, 'Cú pháp: /add nội dung | HH:MM | lặp lại')"}], "m1": [{"t": ["Create the command-line entry point. It glues `parse_add` and `send_message` together.", "Tạo file chạy từ dòng lệnh. File này nối `parse_add` với `send_message`."], "f": "bot/src/todo_bot/cli.py", "act": "new", "code": "import sys\n\nfrom todo_bot.parser import parse_add\nfrom todo_bot.telegram_api import send_message\n\n\ndef main():\n    if len(sys.argv) < 2:\n        print('Cách dùng: uv run python -m todo_bot.cli \"/add Uống thuốc | 20:00 | hằng ngày\"')\n        return\n    task, error = parse_add(sys.argv[1])\n    if error:\n        reply = \"❌ \" + error\n    else:\n        text, hour, minute, repeat = task\n        reply = f\"✅ Đã ghi: {text} lúc {hour:02d}:{minute:02d} ({repeat})\"\n    print(reply)\n    send_message(reply)\n\n\nif __name__ == \"__main__\":\n    main()", "lang": "python"}, {"t": ["Send a valid command. The terminal prints the reply and your phone receives it.", "Gửi một lệnh đúng. Terminal in câu trả lời và điện thoại nhận được tin."], "run": "uv run python -m todo_bot.cli \"/add Uống thuốc | 20:00 | hằng ngày\" ", "out": "✅ Đã ghi: Uống thuốc lúc 20:00 (hằng ngày)", "tg": [["bot", "✅ Đã ghi: Uống thuốc lúc 20:00 (hằng ngày)"]]}, {"t": ["Send a broken one.", "Gửi một lệnh sai."], "run": "uv run python -m todo_bot.cli \"/add Gọi mẹ | 25:00\" ", "out": "❌ Giờ 25 không hợp lệ (0–23)", "tg": [["bot", "❌ Giờ 25 không hợp lệ (0–23)"]]}, {"t": ["Your `src/todo_bot/` should now hold these files. Commit and push.", "Thư mục `src/todo_bot/` giờ phải có các file sau. Commit và push."], "code": "src/todo_bot/\n├── __init__.py\n├── check.py\n├── cli.py\n├── config.py\n├── finder.py\n├── formatting.py\n├── parser.py\n├── telegram_api.py\n└── timeutils.py", "lang": "tree", "run": "git add . && git commit -m \"Bot v0.1: parse /add and send\" && git push"}], "tp09": [{"t": ["Add `format_list` to the end of the formatting module. For now a task is a tuple `(hour, minute, text)`.", "Thêm `format_list` vào cuối module định dạng. Tạm thời mỗi task là một tuple `(hour, minute, text)`."], "f": "bot/src/todo_bot/formatting.py", "act": "add", "code": "def format_list(tasks):\n    \"\"\"tasks: a list of (hour, minute, text) tuples.\"\"\"\n    if not tasks:\n        return \"Chưa có việc nào 🎈\"\n    lines = [f\"📋 Bạn có {len(tasks)} việc:\"]\n    number = 1\n    for task in sorted(tasks):           # tuples sort by hour, then minute\n        lines.append(f\"{number}. {task[0]:02d}:{task[1]:02d} {task[2]}\")\n        number += 1\n    return \"\\n\".join(lines)", "lang": "python"}, {"t": ["Check the order: tuples compare item by item, so they sort by hour, then minute.", "Kiểm tra thứ tự: tuple so sánh từng phần tử, nên sắp theo giờ rồi tới phút."], "run": "uv run python -c \"from todo_bot.formatting import format_list; print(format_list([(20, 0, 'Uống thuốc'), (7, 30, 'Tập thể dục')]))\" ", "out": "📋 Bạn có 2 việc:\n1. 07:30 Tập thể dục\n2. 20:00 Uống thuốc"}], "tp10": [{"t": ["In `parser.py`, add the two dicts right below the imports.", "Trong `parser.py`, thêm hai dict ngay dưới phần import."], "f": "bot/src/todo_bot/parser.py", "act": "edit", "code": "REPEAT_ALIASES = {\n    \"\": \"once\", \"một lần\": \"once\",\n    \"hằng ngày\": \"daily\", \"mỗi ngày\": \"daily\",\n}\nREPEAT_LABELS = {\"once\": \"một lần\", \"daily\": \"hằng ngày\"}", "lang": "python"}, {"t": ["Still in `parser.py`, replace the last line of `parse_add` (`repeat = ...` and `return (text, ...)`) with this. A task is now a dict.", "Vẫn trong `parser.py`, thay hai dòng cuối của `parse_add` (`repeat = ...` và `return (text, ...)`) bằng đoạn này. Giờ task là một dict."], "f": "bot/src/todo_bot/parser.py", "act": "edit", "code": "    word = parts[2].strip().lower() if len(parts) > 2 else \"\"\n    repeat = REPEAT_ALIASES.get(word)\n    if repeat is None:\n        return None, f\"Không hiểu kiểu lặp '{word}'. Dùng: một lần, hằng ngày\"\n    task = {\"text\": text, \"hour\": hour, \"minute\": minute, \"repeat\": repeat, \"done\": False}\n    return task, None", "lang": "python"}, {"t": ["Replace the whole formatting module with the dict version. `pending_sorted` decides the numbering that `/done 2` will use later.", "Thay toàn bộ module định dạng bằng bản dùng dict. `pending_sorted` quyết định số thứ tự mà `/done 2` sẽ dùng sau này."], "f": "bot/src/todo_bot/formatting.py", "act": "replace", "code": "from todo_bot.parser import REPEAT_LABELS\n\n\ndef format_task(text, hour, minute):\n    label = f\"{hour:02d}:{minute:02d}\"\n    return f\"⏰ {label} — {text}\"\n\n\ndef time_key(task):\n    return (task[\"hour\"], task[\"minute\"])\n\n\ndef pending_sorted(tasks):\n    \"\"\"Tasks not done yet, in time order. /done and /del use this numbering.\"\"\"\n    todo = []\n    for task in tasks:\n        if not task[\"done\"]:\n            todo.append(task)\n    return sorted(todo, key=time_key)\n\n\ndef format_list(tasks):\n    todo = pending_sorted(tasks)\n    if not todo:\n        return \"Chưa có việc nào 🎈\"\n    lines = [f\"📋 Bạn có {len(todo)} việc:\"]\n    for i, t in enumerate(todo, start=1):\n        label = REPEAT_LABELS[t[\"repeat\"]]\n        lines.append(f\"{i}. {t['hour']:02d}:{t['minute']:02d} {t['text']} ({label})\")\n    return \"\\n\".join(lines)", "lang": "python"}, {"t": ["Check the new parser output.", "Kiểm tra kết quả parser mới."], "run": "uv run python -c \"from todo_bot.parser import parse_add; print(parse_add('/add Uống thuốc | 20:00 | hằng ngày'))\" ", "out": "({'text': 'Uống thuốc', 'hour': 20, 'minute': 0, 'repeat': 'daily', 'done': False}, None)"}, {"t": ["`cli.py` still expects a tuple, so it is broken until Practice #2 replaces it. That is expected.", "`cli.py` vẫn đang chờ tuple nên tạm thời chạy lỗi, tới Thực hành #2 sẽ thay. Chuyện này là bình thường."]}], "tp11": [{"t": ["Add `group_by_slot` to the end of the formatting module. The tuple returned by `time_key` becomes a dict key.", "Thêm `group_by_slot` vào cuối module định dạng. Tuple do `time_key` trả về được dùng làm khoá dict."], "f": "bot/src/todo_bot/formatting.py", "act": "add", "code": "def group_by_slot(tasks):\n    \"\"\"{(hour, minute): [text, ...]}: one reminder can list everything due at that time.\"\"\"\n    slots = {}\n    for task in tasks:\n        slot = time_key(task)                     # a tuple, so it can be a dict key\n        slots.setdefault(slot, []).append(task[\"text\"])\n    return slots", "lang": "python"}, {"t": ["Two tasks at 20:00 land in the same slot.", "Hai task cùng 20:00 rơi vào cùng một ô."], "run": "uv run python -c \"from todo_bot.formatting import group_by_slot; print(group_by_slot([{'text': 'Uống thuốc', 'hour': 20, 'minute': 0}, {'text': 'Tưới cây', 'hour': 20, 'minute': 0}, {'text': 'Tập thể dục', 'hour': 7, 'minute': 30}]))\" ", "out": "{(20, 0): ['Uống thuốc', 'Tưới cây'], (7, 30): ['Tập thể dục']}"}], "tp12": [{"t": ["Create the stats module.", "Tạo module thống kê."], "f": "bot/src/todo_bot/stats.py", "act": "new", "code": "import random\n\nCHEERS = [\"Giỏi quá! 🎉\", \"Xong một việc, nghỉ chút nhé ☕\", \"Cứ thế phát huy 💪\"]\n\n\ndef word_counts(texts):\n    counts = {}\n    for text in texts:\n        for word in text.lower().split():\n            counts[word] = counts.get(word, 0) + 1\n    return counts\n\n\ndef second(pair):\n    return pair[1]\n\n\ndef top_words(texts, n=3):\n    pairs = sorted(word_counts(texts).items(), key=second, reverse=True)\n    return pairs[:n]\n\n\ndef format_stats(texts):\n    pairs = top_words(texts)\n    if not pairs:\n        return \"Chưa có dữ liệu 📭\"\n    parts = []\n    for word, count in pairs:\n        parts.append(f\"{word} ({count})\")\n    return \"Từ hay gặp: \" + \", \".join(parts)\n\n\ndef cheer():\n    return random.choice(CHEERS)", "lang": "python"}, {"t": ["Check the counts and the random cheer.", "Kiểm tra phần đếm và câu cổ vũ ngẫu nhiên."], "run": "uv run python -c \"from todo_bot.stats import top_words, cheer; print(top_words(['Gọi mẹ', 'Gọi anh Nam', 'Uống thuốc'])); print(cheer())\" ", "out": "[('gọi', 2), ('mẹ', 1), ('anh', 1)]\nXong một việc, nghỉ chút nhé ☕"}], "tp13": [{"t": ["Create the storage module. `path` is a parameter so tests can point it at a temporary folder later.", "Tạo module lưu trữ. `path` là tham số để sau này test có thể trỏ sang thư mục tạm."], "f": "bot/src/todo_bot/storage.py", "act": "new", "code": "import json\nfrom pathlib import Path\n\nDEFAULT_PATH = Path(\"tasks.json\")     # relative to where you run the command: bot/\n\n\ndef save_tasks(tasks, path=DEFAULT_PATH):\n    with path.open(\"w\", encoding=\"utf-8\") as f:\n        json.dump(tasks, f, ensure_ascii=False, indent=2)\n\n\ndef load_tasks(path=DEFAULT_PATH):\n    if not path.exists():\n        return []\n    with path.open(encoding=\"utf-8\") as f:\n        return json.load(f)", "lang": "python"}, {"t": ["Save one task and read it back.", "Lưu một task rồi đọc lại."], "run": "uv run python -c \"from todo_bot.storage import save_tasks, load_tasks; save_tasks([{'text': 'Uống thuốc', 'hour': 20, 'minute': 0, 'repeat': 'daily', 'done': False}]); print(load_tasks())\"\ncat tasks.json", "out": "[{'text': 'Uống thuốc', 'hour': 20, 'minute': 0, 'repeat': 'daily', 'done': False}]\n[\n  {\n    \"text\": \"Uống thuốc\",\n    ...\n]"}, {"t": ["Confirm Git ignores the data file, then delete it.", "Kiểm tra Git bỏ qua file dữ liệu, rồi xoá file đi."], "run": "git status --short   # tasks.json must NOT appear\nrm tasks.json"}], "m2": [{"t": ["Replace `cli.py` with a version that handles three commands and saves after every `/add`.", "Thay `cli.py` bằng bản xử lý ba lệnh và lưu lại sau mỗi lần `/add`."], "f": "bot/src/todo_bot/cli.py", "act": "replace", "code": "import sys\n\nfrom todo_bot.formatting import format_list\nfrom todo_bot.parser import REPEAT_LABELS, parse_add\nfrom todo_bot.stats import format_stats\nfrom todo_bot.storage import load_tasks, save_tasks\nfrom todo_bot.telegram_api import send_message\n\n\ndef handle(cmd, tasks):\n    \"\"\"Run one command against the task list and return the reply text.\"\"\"\n    if cmd.startswith(\"/add\"):\n        task, error = parse_add(cmd)\n        if error:\n            return \"❌ \" + error\n        tasks.append(task)\n        save_tasks(tasks)\n        label = REPEAT_LABELS[task[\"repeat\"]]\n        return f\"✅ Đã ghi: {task['text']} lúc {task['hour']:02d}:{task['minute']:02d} ({label})\"\n    if cmd == \"/list\":\n        return format_list(tasks)\n    if cmd == \"/stats\":\n        texts = []\n        for task in tasks:\n            texts.append(task[\"text\"])\n        return format_stats(texts)\n    return \"Lệnh chưa hỗ trợ. Dùng /add, /list hoặc /stats\"\n\n\ndef main():\n    if len(sys.argv) < 2:\n        print('Cách dùng: uv run python -m todo_bot.cli \"/list\"')\n        return\n    reply = handle(sys.argv[1], load_tasks())\n    print(reply)\n    send_message(reply)\n\n\nif __name__ == \"__main__\":\n    main()", "lang": "python"}, {"t": ["Add three tasks. Each command is a new Python process, so the data must come from `tasks.json`.", "Thêm ba task. Mỗi lệnh là một tiến trình Python mới, nên dữ liệu phải đọc lại từ `tasks.json`."], "run": "uv run python -m todo_bot.cli \"/add Uống thuốc | 20:00 | hằng ngày\"\nuv run python -m todo_bot.cli \"/add Tập thể dục | 07:30 | hằng ngày\"\nuv run python -m todo_bot.cli \"/add Gọi mẹ | 19:00\" "}, {"t": ["List them.", "Xem danh sách."], "run": "uv run python -m todo_bot.cli \"/list\" ", "out": "📋 Bạn có 3 việc:\n1. 07:30 Tập thể dục (hằng ngày)\n2. 19:00 Gọi mẹ (một lần)\n3. 20:00 Uống thuốc (hằng ngày)", "tg": [["bot", "📋 Bạn có 3 việc:\n1. 07:30 Tập thể dục (hằng ngày)\n2. 19:00 Gọi mẹ (một lần)\n3. 20:00 Uống thuốc (hằng ngày)"]]}, {"t": ["Try `/stats` and an unknown repeat word, then commit.", "Thử `/stats` và một kiểu lặp không hỗ trợ, rồi commit."], "run": "uv run python -m todo_bot.cli \"/stats\"\nuv run python -m todo_bot.cli \"/add Họp | 09:00 | hằng tháng\"\ngit add . && git commit -m \"Bot v0.2: tasks saved to JSON\" ", "out": "Từ hay gặp: uống (1), thuốc (1), tập (1)\n❌ Không hiểu kiểu lặp 'hằng tháng'. Dùng: một lần, hằng ngày"}], "tp14": [{"t": ["Create the models module, starting with the function-based version from the book.", "Tạo module models, bắt đầu bằng phiên bản dùng hàm như trong sách."], "f": "bot/src/todo_bot/models.py", "act": "new", "code": "class Time:\n    \"\"\"Represents a time of day.\"\"\"\n\n\ndef make_time(hour, minute):\n    t = Time()\n    t.hour = hour\n    t.minute = minute\n    return t\n\n\ndef add_minutes(t, minutes):\n    \"\"\"Pure function: returns a new Time, leaves t unchanged.\"\"\"\n    total = t.hour * 60 + t.minute + minutes\n    return make_time(total // 60 % 24, total % 60)", "lang": "python"}, {"t": ["Snooze 23:55 by 10 minutes.", "Hoãn 23:55 thêm 10 phút."], "run": "uv run python -c \"from todo_bot.models import make_time, add_minutes; t = make_time(23, 55); s = add_minutes(t, 10); print(s.hour, s.minute, '| original:', t.minute)\" ", "out": "0 5 | original: 55"}], "tp15": [{"t": ["Replace the whole models module with a real class. The functions from the previous chapter become methods.", "Thay toàn bộ module models bằng một class thật. Các hàm ở chương trước trở thành method."], "f": "bot/src/todo_bot/models.py", "act": "replace", "code": "class Time:\n    def __init__(self, hour=0, minute=0):\n        self.hour = hour\n        self.minute = minute\n\n    def __str__(self):\n        return f\"{self.hour:02d}:{self.minute:02d}\"\n\n    def __add__(self, minutes):\n        total = self.hour * 60 + self.minute + minutes\n        return Time(total // 60 % 24, total % 60)\n\n    def __lt__(self, other):\n        return (self.hour, self.minute) < (other.hour, other.minute)\n\n    @staticmethod\n    def parse(s):\n        h, m = s.split(\":\")\n        return Time(int(h), int(m))", "lang": "python"}, {"t": ["`+`, `<` and `print` now work on Time objects.", "Giờ `+`, `<` và `print` đều dùng được với đối tượng Time."], "run": "uv run python -c \"from todo_bot.models import Time; print(Time.parse('20:00') + 15, Time(23, 55) + 10); print([str(t) for t in sorted([Time(20), Time(7, 30), Time(12)])])\" ", "out": "20:15 00:05\n['07:30', '12:00', '20:00']"}], "tp16": [{"t": ["Inside `class Time`, add an `__eq__` method (below `__lt__`).", "Bên trong `class Time`, thêm method `__eq__` (đặt dưới `__lt__`)."], "f": "bot/src/todo_bot/models.py", "act": "edit", "code": "    def __eq__(self, other):\n        return (self.hour, self.minute) == (other.hour, other.minute)", "lang": "python"}, {"t": ["Add the `Task` class to the end of the file. A Task **has a** Time.", "Thêm class `Task` vào cuối file. Task **có một** Time bên trong."], "f": "bot/src/todo_bot/models.py", "act": "add", "code": "class Task:\n    def __init__(self, text, at, repeat, chat_id=None, done=False, task_id=0):\n        self.text = text\n        self.at = at              # a Time object (composition)\n        self.repeat = repeat\n        self.chat_id = chat_id\n        self.done = done\n        self.task_id = task_id\n\n    def __eq__(self, other):\n        \"\"\"Same text at the same time = duplicate task.\"\"\"\n        return self.text == other.text and self.at == other.at", "lang": "python"}, {"t": ["`in` uses `__eq__`, which is how the bot will refuse duplicates.", "`in` dùng `__eq__`, bot sẽ dựa vào đó để chặn việc trùng."], "run": "uv run python -c \"from todo_bot.models import Task, Time; a = Task('Uống thuốc', Time(20), 'daily'); b = Task('Uống thuốc', Time(20), 'daily'); print(a == b, a is b, b in [a])\" ", "out": "True False True"}], "tp17": [{"t": ["Add the repeat classes to `models.py`, **above** `class Task`.", "Thêm các class kiểu lặp vào `models.py`, đặt **phía trên** `class Task`."], "f": "bot/src/todo_bot/models.py", "act": "edit", "code": "# python-telegram-bot numbers days 0 = Sunday ... 6 = Saturday\nDAY_NUM = {\"CN\": 0, \"T2\": 1, \"T3\": 2, \"T4\": 3, \"T5\": 4, \"T6\": 5, \"T7\": 6}\nDAY_ORDER = [\"T2\", \"T3\", \"T4\", \"T5\", \"T6\", \"T7\", \"CN\"]\n\n\nclass Repeat:\n    code = \"once\"                  # class attributes\n    label = \"một lần\"\n\n    def describe(self):\n        return self.label\n\n    def job_days(self):\n        \"\"\"Days for JobQueue.run_daily, or None for a one-off reminder.\"\"\"\n        return None\n\n\nclass Daily(Repeat):\n    code = \"daily\"\n    label = \"hằng ngày\"\n\n    def job_days(self):\n        return (0, 1, 2, 3, 4, 5, 6)\n\n\nclass Weekly(Repeat):\n    code = \"weekly\"\n\n    def __init__(self, days):\n        super().__init__()\n        self.days = days            # e.g. {\"T2\", \"T5\"}\n\n    def describe(self):\n        ordered = []\n        for day in DAY_ORDER:\n            if day in self.days:\n                ordered.append(day)\n        return \"mỗi \" + \", \".join(ordered)\n\n    def job_days(self):\n        numbers = []\n        for day in self.days:\n            numbers.append(DAY_NUM[day])\n        return tuple(sorted(numbers))\n\n\ndef repeat_from(code, days):\n    \"\"\"Rebuild a Repeat from what we saved in tasks.json.\"\"\"\n    if code == \"daily\":\n        return Daily()\n    if code == \"weekly\":\n        return Weekly(set(days))\n    return Repeat()", "lang": "python"}, {"t": ["Replace the whole parser. `parse_add` now returns a `Task` object, and the repeat text becomes a `Repeat`, `Daily` or `Weekly`.", "Thay toàn bộ parser. Giờ `parse_add` trả về đối tượng `Task`, và chữ kiểu lặp được đổi thành `Repeat`, `Daily` hoặc `Weekly`."], "f": "bot/src/todo_bot/parser.py", "act": "replace", "code": "import re\n\nfrom todo_bot.models import DAY_NUM, Daily, Repeat, Task, Time, Weekly\nfrom todo_bot.timeutils import time_error\n\nTIME_RE = r\"(\\d{1,2}):(\\d{2})\"\n\n\ndef make_repeat(word):\n    \"\"\"'hằng ngày' -> Daily(), 'T2,T5' -> Weekly({'T2', 'T5'}), unknown -> None.\"\"\"\n    w = word.strip().lower()\n    if w in (\"\", \"một lần\"):\n        return Repeat()\n    if w in (\"hằng ngày\", \"mỗi ngày\"):\n        return Daily()\n    days = set()\n    for part in w.split(\",\"):\n        day = part.strip().upper()\n        if day not in DAY_NUM:\n            return None\n        days.add(day)\n    return Weekly(days)\n\n\ndef parse_add(cmd):\n    \"\"\"Return (Task, None), or (None, error message) on bad input.\"\"\"\n    parts = cmd.removeprefix(\"/add\").split(\"|\")\n    if len(parts) < 2:\n        return None, \"Cú pháp: /add nội dung | HH:MM | lặp lại\"\n    text = parts[0].strip()\n    at = parts[1].strip()\n    if not text:\n        return None, \"Thiếu nội dung việc cần làm\"\n    m = re.fullmatch(TIME_RE, at)\n    if not m:\n        return None, f\"Không hiểu giờ '{at}'. Dùng dạng HH:MM, ví dụ 07:00\"\n    hour, minute = int(m.group(1)), int(m.group(2))\n    error = time_error(hour, minute)\n    if error:\n        return None, error\n    word = parts[2] if len(parts) > 2 else \"\"\n    repeat = make_repeat(word)\n    if repeat is None:\n        return None, f\"Không hiểu kiểu lặp '{word.strip()}'. Dùng: một lần, hằng ngày, hoặc T2,T5\"\n    return Task(text, Time(hour, minute), repeat), None", "lang": "python"}, {"t": ["Check the weekly case. `(1, 4)` is Monday and Thursday in python-telegram-bot's numbering.", "Kiểm tra kiểu lặp theo tuần. `(1, 4)` là thứ Hai và thứ Năm theo cách đánh số của python-telegram-bot."], "run": "uv run python -c \"from todo_bot.parser import parse_add; t, e = parse_add('/add Họp | 09:00 | T2,T5'); print(t.text, t.at, t.repeat.describe(), t.repeat.job_days())\" ", "out": "Họp 09:00 mỗi T2, T5 (1, 4)"}, {"t": ["`formatting.py` and `cli.py` still use dicts and will break now. Chapter 18 fixes formatting; `cli.py` is replaced by the real bot in Practice #3.", "`formatting.py` và `cli.py` vẫn dùng dict nên giờ sẽ lỗi. Chương 18 sửa formatting; `cli.py` sẽ được thay bằng bot thật ở Thực hành #3."]}], "tp18": [{"t": ["Replace the stats module: `Counter` does the counting and sorting for you.", "Thay module thống kê: `Counter` đếm và sắp xếp hộ bạn."], "f": "bot/src/todo_bot/stats.py", "act": "replace", "code": "import random\nfrom collections import Counter\n\nCHEERS = [\"Giỏi quá! 🎉\", \"Xong một việc, nghỉ chút nhé ☕\", \"Cứ thế phát huy 💪\"]\n\n\ndef top_words(texts, n=3):\n    return Counter(w for t in texts for w in t.lower().split()).most_common(n)\n\n\ndef format_stats(texts):\n    pairs = top_words(texts)\n    if not pairs:\n        return \"Chưa có dữ liệu 📭\"\n    return \"Từ hay gặp: \" + \", \".join(f\"{w} ({c})\" for w, c in pairs)\n\n\ndef cheer():\n    return random.choice(CHEERS)", "lang": "python"}, {"t": ["Replace the formatting module with the Task-object version, using comprehensions.", "Thay module định dạng bằng bản dùng đối tượng Task, viết bằng comprehension."], "f": "bot/src/todo_bot/formatting.py", "act": "replace", "code": "def format_task(text, hour, minute):\n    return f\"⏰ {hour:02d}:{minute:02d} — {text}\"\n\n\ndef pending_sorted(tasks):\n    \"\"\"Tasks not done yet, in time order. /done and /del use this numbering.\"\"\"\n    return sorted((t for t in tasks if not t.done), key=lambda t: t.at)\n\n\ndef format_list(tasks):\n    todo = pending_sorted(tasks)\n    if not todo:\n        return \"Chưa có việc nào 🎈\"\n    lines = [f\"📋 Bạn có {len(todo)} việc:\"]\n    lines += [f\"{i}. {t.at} {t.text} ({t.repeat.describe()})\" for i, t in enumerate(todo, start=1)]\n    return \"\\n\".join(lines)", "lang": "python"}, {"t": ["In `models.py`, replace `describe` and `job_days` inside `class Weekly` with these one-liners.", "Trong `models.py`, thay `describe` và `job_days` của `class Weekly` bằng hai dòng ngắn gọn này."], "f": "bot/src/todo_bot/models.py", "act": "edit", "code": "    def describe(self):\n        return \"mỗi \" + \", \".join(d for d in DAY_ORDER if d in self.days)\n\n    def job_days(self):\n        return tuple(sorted(DAY_NUM[d] for d in self.days))", "lang": "python"}, {"t": ["Check the list output with real Task objects.", "Kiểm tra danh sách với đối tượng Task thật."], "run": "uv run python -c \"from todo_bot.parser import parse_add; from todo_bot.formatting import format_list; ts = [parse_add(c)[0] for c in ['/add Uống thuốc | 20:00 | hằng ngày', '/add Họp | 09:00 | T2,T5']]; print(format_list(ts))\" ", "out": "📋 Bạn có 2 việc:\n1. 09:00 Họp (mỗi T2, T5)\n2. 20:00 Uống thuốc (hằng ngày)"}], "m3": [{"t": ["Install the bot framework with its scheduler extra. Without `[job-queue]`, `context.job_queue` is `None`.", "Cài framework bot kèm phần lập lịch. Thiếu `[job-queue]` thì `context.job_queue` sẽ là `None`."], "run": "uv add \"python-telegram-bot[job-queue]\" "}, {"t": ["Inside `class Task` in `models.py`, add two methods so a Task can be saved as JSON and loaded back.", "Bên trong `class Task` của `models.py`, thêm hai method để lưu Task thành JSON và đọc lại."], "f": "bot/src/todo_bot/models.py", "act": "edit", "code": "    def to_dict(self):\n        days = sorted(self.repeat.days) if isinstance(self.repeat, Weekly) else []\n        return {\"id\": self.task_id, \"text\": self.text, \"hour\": self.at.hour,\n                \"minute\": self.at.minute, \"repeat\": self.repeat.code, \"days\": days,\n                \"chat_id\": self.chat_id, \"done\": self.done}\n\n    @staticmethod\n    def from_dict(d):\n        return Task(d[\"text\"], Time(d[\"hour\"], d[\"minute\"]),\n                    repeat_from(d[\"repeat\"], d[\"days\"]),\n                    chat_id=d[\"chat_id\"], done=d[\"done\"], task_id=d[\"id\"])", "lang": "python"}, {"t": ["Create the handlers module: one `async def` per command, plus the JobQueue scheduling. Handlers work like Express route handlers: they receive the incoming `update` and reply.", "Tạo module handlers: mỗi lệnh là một hàm `async def`, kèm phần lập lịch JobQueue. Handler giống route handler của Express: nhận `update` gửi tới rồi trả lời."], "f": "bot/src/todo_bot/handlers.py", "act": "new", "code": "import datetime as dt\nfrom pathlib import Path\nfrom zoneinfo import ZoneInfo\n\nfrom todo_bot.formatting import format_list, pending_sorted\nfrom todo_bot.models import Task\nfrom todo_bot.parser import parse_add\nfrom todo_bot.stats import cheer, format_stats\nfrom todo_bot.storage import load_tasks, save_tasks\n\nVN = ZoneInfo(\"Asia/Ho_Chi_Minh\")   # JobQueue uses UTC unless you say otherwise\nTASKS = []                          # every Task the bot knows about\nDATA_PATH = Path(\"tasks.json\")\n\nHELP = (\n    \"Chào bạn 👋\\n\"\n    \"Tạo việc: /add nội dung | HH:MM | lặp lại\\n\"\n    \"Ví dụ: /add Uống thuốc | 20:00 | hằng ngày\\n\"\n    \"Xem: /list · Xong: /done 1 · Xoá: /del 1 · Thống kê: /stats\"\n)\n\n\ndef load():\n    TASKS.clear()\n    for d in load_tasks(DATA_PATH):\n        TASKS.append(Task.from_dict(d))\n\n\ndef save():\n    save_tasks([t.to_dict() for t in TASKS], DATA_PATH)\n\n\ndef find(task_id):\n    for t in TASKS:\n        if t.task_id == task_id:\n            return t\n    return None\n\n\ndef schedule(job_queue, task):\n    \"\"\"Register the reminder for one task with the JobQueue.\"\"\"\n    at = dt.time(task.at.hour, task.at.minute, tzinfo=VN)\n    name = str(task.task_id)\n    days = task.repeat.job_days()\n    if days is None:                                   # one-off: next time it is HH:MM\n        now = dt.datetime.now(VN)\n        when = dt.datetime.combine(now.date(), at)\n        if when <= now:\n            when += dt.timedelta(days=1)\n        job_queue.run_once(remind, when, chat_id=task.chat_id, name=name, data=task.task_id)\n    else:\n        job_queue.run_daily(remind, at, days=days, chat_id=task.chat_id, name=name, data=task.task_id)\n\n\ndef unschedule(job_queue, task):\n    for job in job_queue.get_jobs_by_name(str(task.task_id)):\n        job.schedule_removal()\n\n\nasync def remind(context):\n    \"\"\"Called by the JobQueue at the reminder time.\"\"\"\n    job = context.job\n    task = find(job.data)\n    if task is None or task.done:\n        return\n    await context.bot.send_message(job.chat_id, f\"⏰ {task.text}\")\n    if task.repeat.code == \"once\":\n        task.done = True\n        save()\n\n\nasync def start(update, context):\n    await update.message.reply_text(HELP)\n\n\nasync def add(update, context):\n    task, error = parse_add(update.message.text)\n    if error:\n        await update.message.reply_text(\"❌ \" + error)\n        return\n    if task in TASKS:                                  # uses Task.__eq__\n        await update.message.reply_text(\"⚠️ Việc này đã có rồi\")\n        return\n    task.chat_id = update.effective_chat.id\n    task.task_id = max((t.task_id for t in TASKS), default=0) + 1\n    TASKS.append(task)\n    save()\n    schedule(context.job_queue, task)\n    await update.message.reply_text(f\"✅ Đã ghi: {task.text} lúc {task.at} ({task.repeat.describe()})\")\n\n\nasync def list_tasks(update, context):\n    await update.message.reply_text(format_list(TASKS))\n\n\nasync def stats(update, context):\n    await update.message.reply_text(format_stats([t.text for t in TASKS]))\n\n\ndef pick(args):\n    \"\"\"'/done 2' -> the 2nd task shown by /list, or None.\"\"\"\n    if not args or not args[0].isdigit():\n        return None\n    number = int(args[0])\n    todo = pending_sorted(TASKS)\n    if not 1 <= number <= len(todo):\n        return None\n    return todo[number - 1]\n\n\nasync def done(update, context):\n    task = pick(context.args)\n    if task is None:\n        await update.message.reply_text(\"❌ Dùng: /done số_thứ_tự (xem /list)\")\n        return\n    task.done = True\n    save()\n    unschedule(context.job_queue, task)\n    await update.message.reply_text(f\"{cheer()} Đã đánh dấu xong: {task.text}\")\n\n\nasync def delete(update, context):\n    task = pick(context.args)\n    if task is None:\n        await update.message.reply_text(\"❌ Dùng: /del số_thứ_tự (xem /list)\")\n        return\n    TASKS.remove(task)\n    save()\n    unschedule(context.job_queue, task)\n    await update.message.reply_text(f\"🗑 Đã xoá: {task.text}\")", "lang": "python"}, {"t": ["Create the entry point that wires commands to handlers and re-schedules saved tasks.", "Tạo file khởi chạy: nối lệnh với handler và lên lịch lại các task đã lưu."], "f": "bot/src/todo_bot/main.py", "act": "new", "code": "from telegram.ext import Application, CommandHandler\n\nfrom todo_bot import config, handlers\n\n\ndef main():\n    handlers.load()\n    app = Application.builder().token(config.TOKEN).build()\n    app.add_handler(CommandHandler(\"start\", handlers.start))\n    app.add_handler(CommandHandler(\"add\", handlers.add))\n    app.add_handler(CommandHandler(\"list\", handlers.list_tasks))\n    app.add_handler(CommandHandler(\"done\", handlers.done))\n    app.add_handler(CommandHandler(\"del\", handlers.delete))\n    app.add_handler(CommandHandler(\"stats\", handlers.stats))\n    for task in handlers.TASKS:                  # re-schedule after a restart\n        if not task.done and task.chat_id is not None:\n            handlers.schedule(app.job_queue, task)\n    print(\"🤖 Bot đang chạy. Nhấn Ctrl+C để dừng.\")\n    app.run_polling()\n\n\nif __name__ == \"__main__\":\n    main()", "lang": "python"}, {"t": ["Start the bot. It keeps running (long polling) until you stop it.", "Chạy bot. Bot sẽ chạy liên tục (long polling) cho tới khi bạn dừng."], "run": "uv run python -m todo_bot.main", "out": "🤖 Bot đang chạy. Nhấn Ctrl+C để dừng."}, {"t": ["In Telegram, test every command. Use a time two minutes from now so you see a real reminder.", "Trên Telegram, thử từng lệnh. Đặt giờ 2 phút sau thời điểm hiện tại để thấy lời nhắc thật."], "tg": [["me", "/start"], ["bot", "Chào bạn 👋\nTạo việc: /add nội dung | HH:MM | lặp lại\n…"], ["me", "/add Test nhắc | 14:32"], ["bot", "✅ Đã ghi: Test nhắc lúc 14:32 (một lần)"], ["sys", "14:32"], ["bot", "⏰ Test nhắc"], ["me", "/add Uống thuốc | 20:00 | hằng ngày"], ["bot", "✅ Đã ghi: Uống thuốc lúc 20:00 (hằng ngày)"], ["me", "/list"], ["bot", "📋 Bạn có 1 việc:\n1. 20:00 Uống thuốc (hằng ngày)"], ["me", "/done 1"], ["bot", "Giỏi quá! 🎉 Đã đánh dấu xong: Uống thuốc"]]}, {"t": ["Press Ctrl+C, start it again, and send `/list`: tasks come back from `tasks.json` and their reminders are re-scheduled. Then delete the old CLI and commit.", "Nhấn Ctrl+C, chạy lại, gửi `/list`: task được nạp lại từ `tasks.json` và lời nhắc được lên lịch lại. Sau đó xoá CLI cũ và commit."], "run": "rm src/todo_bot/cli.py\ngit add . && git commit -m \"Bot v1.0: always-on bot with reminders\" && git push"}], "ip1": [{"t": ["Search the code for the patterns this chapter calls harmful.", "Tìm trong code các mẫu mà chương này coi là nên tránh."], "run": "grep -rnE \"range\\(len\\(|== (True|False|None)|=\\[\\]|len\\(.*\\) == 0\" src/", "out": "(nothing printed = clean)"}, {"t": ["For each hit, apply the idiom. Typical fixes in this codebase:", "Với mỗi chỗ tìm thấy, sửa theo cách viết chuẩn. Các chỗ sửa hay gặp trong code này:"], "code": "# before                               # after\nif len(todo) == 0:                     if not todo:\nif task.done == True:                  if task.done:\nif repeat == None:                     if repeat is None:\nfor i in range(len(todo)):             for i, t in enumerate(todo, start=1):\ndef add(task, tags=[]):                def add(task, tags=None):", "lang": "python"}, {"t": ["Restart the bot and run a quick smoke test (`/add`, `/list`, `/done 1`) to make sure nothing changed in behaviour.", "Chạy lại bot và thử nhanh (`/add`, `/list`, `/done 1`) để chắc chắn hành vi không đổi."], "run": "uv run python -m todo_bot.main"}], "ip2": [{"t": ["In `handlers.py`, replace the loop inside `load()` and `find()` with these one-liners.", "Trong `handlers.py`, thay vòng lặp trong `load()` và `find()` bằng hai dòng gọn này."], "f": "bot/src/todo_bot/handlers.py", "act": "edit", "code": "def load():\n    TASKS.clear()\n    TASKS.extend(Task.from_dict(d) for d in load_tasks(DATA_PATH))   # generator expression\n\n\ndef find(task_id):\n    return next((t for t in TASKS if t.task_id == task_id), None)    # first match or None", "lang": "python"}, {"t": ["Check there is no `+=` string building left, and that `/list` and `/stats` still look right.", "Kiểm tra không còn chỗ nối chuỗi bằng `+=`, và `/list`, `/stats` vẫn hiển thị đúng."], "run": "grep -rn '+= f\"' src/\nuv run python -m todo_bot.main"}], "ip3": [{"t": ["Check the layout. `check.py` stays as a diagnostic tool; `finder.py` can stay as a doctest example.", "Kiểm tra cấu trúc thư mục. `check.py` giữ lại làm công cụ kiểm tra; `finder.py` giữ làm ví dụ doctest."], "code": "bot/\n├── pyproject.toml\n├── .env                 # not in Git\n├── tasks.json           # not in Git\n├── src/todo_bot/\n│   ├── __init__.py\n│   ├── check.py         # diagnostics: getMe + chat id\n│   ├── config.py        # TOKEN, CHAT_ID\n│   ├── finder.py\n│   ├── formatting.py    # format_list, pending_sorted\n│   ├── handlers.py      # async command handlers + JobQueue\n│   ├── main.py          # builds the Application\n│   ├── models.py        # Time, Repeat, Daily, Weekly, Task\n│   ├── parser.py        # parse_add\n│   ├── stats.py\n│   ├── storage.py       # load_tasks, save_tasks\n│   ├── telegram_api.py  # call, send_message\n│   └── timeutils.py\n└── tests/               # next phase", "lang": "tree"}, {"t": ["Give the bot a command name. In `pyproject.toml`, point the script at `main.py`.", "Đặt tên lệnh cho bot. Trong `pyproject.toml`, trỏ script tới `main.py`."], "f": "bot/pyproject.toml", "act": "edit", "code": "[project.scripts]\ntodo-bot = \"todo_bot.main:main\" ", "lang": "toml", "run": "uv run todo-bot", "out": "🤖 Bot đang chạy. Nhấn Ctrl+C để dừng."}, {"t": ["Prove that importing a module has no side effects: this must print nothing and must not start the bot.", "Kiểm tra import module không gây tác dụng phụ: lệnh này không được in gì và không được khởi động bot."], "run": "uv run python -c \"import todo_bot.main, todo_bot.handlers\" ", "out": "(no output)"}, {"t": ["Order the imports in every file: standard library, third-party, then `todo_bot`, separated by blank lines. `handlers.py` should start like this:", "Sắp xếp import trong mọi file: thư viện chuẩn, thư viện ngoài, rồi `todo_bot`, mỗi nhóm cách một dòng trống. `handlers.py` nên bắt đầu như sau:"], "f": "bot/src/todo_bot/handlers.py", "act": "edit", "code": "import datetime as dt\nfrom pathlib import Path\nfrom zoneinfo import ZoneInfo\n\nfrom telegram import Update\nfrom telegram.ext import ContextTypes, JobQueue\n\nfrom todo_bot.formatting import format_list, pending_sorted\nfrom todo_bot.models import Task", "lang": "python"}], "ip4": [{"t": ["Replace the whole parser with the exception-based version (the final one, with type hints you will learn next phase).", "Thay toàn bộ parser bằng bản dùng exception (bản cuối cùng, có type hint sẽ học ở phase sau)."], "f": "bot/src/todo_bot/parser.py", "act": "replace", "code": "import re\n\nfrom todo_bot.models import DAY_NUM, Daily, Repeat, Task, Time, Weekly\nfrom todo_bot.timeutils import time_error\n\nTIME_RE = r\"(\\d{1,2}):(\\d{2})\"\n\n\nclass ParseError(ValueError):\n    \"\"\"The user typed a command we cannot understand.\"\"\"\n\n\ndef make_repeat(word: str) -> Repeat:\n    w = word.strip().lower()\n    if w in (\"\", \"một lần\", \"once\"):\n        return Repeat()\n    if w in (\"hằng ngày\", \"mỗi ngày\", \"daily\"):\n        return Daily()\n    days = {d.strip().upper() for d in w.split(\",\")}\n    if days <= DAY_NUM.keys():\n        return Weekly(days)\n    raise ParseError(f\"Không hiểu kiểu lặp '{word.strip()}'. Dùng: một lần, hằng ngày, hoặc T2,T5\")\n\n\ndef parse_add_command(cmd: str) -> Task:\n    parts = cmd.removeprefix(\"/add\").split(\"|\")\n    if len(parts) < 2:\n        raise ParseError(\"Cú pháp: /add nội dung | HH:MM | lặp lại\")\n    text, at = parts[0].strip(), parts[1].strip()\n    if not text:\n        raise ParseError(\"Thiếu nội dung việc cần làm\")\n    m = re.fullmatch(TIME_RE, at)\n    if not m:\n        raise ParseError(f\"Không hiểu giờ '{at}'. Dùng dạng HH:MM, ví dụ 07:00\")\n    hour, minute = int(m.group(1)), int(m.group(2))\n    if error := time_error(hour, minute):\n        raise ParseError(error)\n    repeat = make_repeat(parts[2] if len(parts) > 2 else \"\")\n    return Task(text, Time(hour, minute), repeat)", "lang": "python"}, {"t": ["In `handlers.py`, update the import and the start of `add()`.", "Trong `handlers.py`, sửa dòng import và phần đầu hàm `add()`."], "f": "bot/src/todo_bot/handlers.py", "act": "edit", "code": "from todo_bot.parser import ParseError, parse_add_command\n\n\nasync def add(update, context):\n    try:\n        task = parse_add_command(update.message.text)\n    except ParseError as e:\n        await update.message.reply_text(f\"❌ {e}\")\n        return\n    ...   # the rest of add() stays the same", "lang": "python"}, {"t": ["Rewrite `pick()` in EAFP style. Note the extra range check: `todo[-1]` is valid Python, so `/done 0` would silently pick the last task.", "Viết lại `pick()` theo kiểu EAFP. Chú ý phần kiểm tra khoảng: `todo[-1]` là Python hợp lệ, nên `/done 0` sẽ âm thầm chọn task cuối cùng."], "f": "bot/src/todo_bot/handlers.py", "act": "edit", "code": "def pick(args):\n    \"\"\"'/done 2' -> the 2nd task shown by /list, or None.\"\"\"\n    try:\n        number = int(args[0])\n    except (TypeError, ValueError, IndexError):   # no args / not a number\n        return None\n    todo = pending_sorted(TASKS)\n    return todo[number - 1] if 1 <= number <= len(todo) else None   # /done 0 would pick the last one!", "lang": "python"}, {"t": ["Check the error message.", "Kiểm tra thông báo lỗi."], "run": "uv run python -c \"from todo_bot.parser import parse_add_command, ParseError\ntry:\n    parse_add_command('/add Đi chợ | 7h sáng')\nexcept ParseError as e:\n    print('ParseError:', e)\" ", "out": "ParseError: Không hiểu giờ '7h sáng'. Dùng dạng HH:MM, ví dụ 07:00"}], "ty1": [{"t": ["Install mypy as a dev dependency (like `npm i -D typescript`).", "Cài mypy làm dev dependency (giống `npm i -D typescript`)."], "run": "uv add --dev mypy"}, {"t": ["Annotate the small modules first. `timeutils.py` becomes:", "Thêm type cho các module nhỏ trước. `timeutils.py` thành:"], "f": "bot/src/todo_bot/timeutils.py", "act": "replace", "code": "def time_error(hour: int, minute: int) -> str | None:\n    if not 0 <= hour < 24:\n        return f\"Giờ {hour} không hợp lệ (0–23)\"\n    if not 0 <= minute < 60:\n        return f\"Phút {minute} không hợp lệ (0–59)\"\n    return None\n\n\ndef is_valid_time(hour: int, minute: int) -> bool:\n    return time_error(hour, minute) is None\n\n\ndef minutes_until(now_h: int, now_m: int, at_h: int, at_m: int) -> int:\n    diff = (at_h * 60 + at_m) - (now_h * 60 + now_m)\n    return diff % (24 * 60)", "lang": "python"}, {"t": ["`telegram_api.py`: `**params: Any` because the Bot API accepts many shapes.", "`telegram_api.py`: dùng `**params: Any` vì Bot API nhận rất nhiều kiểu tham số."], "f": "bot/src/todo_bot/telegram_api.py", "act": "replace", "code": "from typing import Any\n\nimport httpx\n\nfrom todo_bot import config\n\nAPI = f\"https://api.telegram.org/bot{config.TOKEN}\"\n\n\ndef call(method: str, **params: Any) -> Any:\n    \"\"\"Call one Bot API method and return its `result`.\"\"\"\n    r = httpx.post(f\"{API}/{method}\", json=params, timeout=10)\n    data = r.json()\n    if not data[\"ok\"]:\n        raise RuntimeError(f\"{method}: {data['description']}\")\n    return data[\"result\"]\n\n\ndef send_message(text: str, chat_id: int | str | None = None) -> Any:\n    return call(\"sendMessage\", chat_id=chat_id or config.CHAT_ID, text=text)", "lang": "python"}, {"t": ["Run mypy. Fix what it reports, then repeat until it says Success.", "Chạy mypy. Sửa những gì nó báo, chạy lại tới khi ra Success."], "run": "uv run mypy src/", "out": "Success: no issues found in 13 source files"}], "ty2": [{"t": ["Replace `models.py` with the fully typed version: `Literal` for repeat codes and a `TaskDict` for the JSON shape.", "Thay `models.py` bằng bản đủ type: `Literal` cho mã kiểu lặp và `TaskDict` cho hình dạng JSON."], "f": "bot/src/todo_bot/models.py", "act": "replace", "code": "from typing import Literal, NotRequired, TypedDict\n\ntype RepeatCode = Literal[\"once\", \"daily\", \"weekly\"]\n\n# python-telegram-bot: 0 = Sunday ... 6 = Saturday\nDAY_NUM = {\"CN\": 0, \"T2\": 1, \"T3\": 2, \"T4\": 3, \"T5\": 4, \"T6\": 5, \"T7\": 6}\nDAY_ORDER = [\"T2\", \"T3\", \"T4\", \"T5\", \"T6\", \"T7\", \"CN\"]\n\n\nclass Time:\n    def __init__(self, hour: int = 0, minute: int = 0) -> None:\n        self.hour = hour\n        self.minute = minute\n\n    def __str__(self) -> str:\n        return f\"{self.hour:02d}:{self.minute:02d}\"\n\n    def __add__(self, minutes: int) -> Time:\n        total = self.hour * 60 + self.minute + minutes\n        return Time(total // 60 % 24, total % 60)\n\n    def __lt__(self, other: Time) -> bool:\n        return (self.hour, self.minute) < (other.hour, other.minute)\n\n    def __eq__(self, other: object) -> bool:\n        if not isinstance(other, Time):\n            return NotImplemented\n        return (self.hour, self.minute) == (other.hour, other.minute)\n\n    @staticmethod\n    def parse(s: str) -> Time:\n        h, m = s.split(\":\")\n        return Time(int(h), int(m))\n\n\nclass Repeat:\n    code: RepeatCode = \"once\"\n    label = \"một lần\"\n\n    def describe(self) -> str:\n        return self.label\n\n    def job_days(self) -> tuple[int, ...] | None:\n        \"\"\"Days for JobQueue.run_daily, or None for a one-off reminder.\"\"\"\n        return None\n\n\nclass Daily(Repeat):\n    code = \"daily\"\n    label = \"hằng ngày\"\n\n    def job_days(self) -> tuple[int, ...] | None:\n        return (0, 1, 2, 3, 4, 5, 6)\n\n\nclass Weekly(Repeat):\n    code = \"weekly\"\n\n    def __init__(self, days: set[str]) -> None:\n        super().__init__()\n        self.days = days\n\n    def describe(self) -> str:\n        return \"mỗi \" + \", \".join(d for d in DAY_ORDER if d in self.days)\n\n    def job_days(self) -> tuple[int, ...] | None:\n        return tuple(sorted(DAY_NUM[d] for d in self.days))\n\n\ndef repeat_from(code: str, days: list[str]) -> Repeat:\n    if code == \"daily\":\n        return Daily()\n    if code == \"weekly\":\n        return Weekly(set(days))\n    return Repeat()\n\n\nclass TaskDict(TypedDict):\n    id: int\n    text: str\n    hour: int\n    minute: int\n    repeat: RepeatCode\n    days: list[str]\n    chat_id: int | None\n    done: bool\n    note: NotRequired[str]\n\n\nclass Task:\n    def __init__(self, text: str, at: Time, repeat: Repeat,\n                 chat_id: int | None = None, done: bool = False, task_id: int = 0) -> None:\n        self.text = text\n        self.at = at\n        self.repeat = repeat\n        self.chat_id = chat_id\n        self.done = done\n        self.task_id = task_id\n\n    def __eq__(self, other: object) -> bool:\n        if not isinstance(other, Task):\n            return NotImplemented\n        return self.text == other.text and self.at == other.at\n\n    def to_dict(self) -> TaskDict:\n        days = sorted(self.repeat.days) if isinstance(self.repeat, Weekly) else []\n        return {\"id\": self.task_id, \"text\": self.text, \"hour\": self.at.hour,\n                \"minute\": self.at.minute, \"repeat\": self.repeat.code, \"days\": days,\n                \"chat_id\": self.chat_id, \"done\": self.done}\n\n    @staticmethod\n    def from_dict(d: TaskDict) -> Task:\n        return Task(d[\"text\"], Time(d[\"hour\"], d[\"minute\"]),\n                    repeat_from(d[\"repeat\"], d[\"days\"]),\n                    chat_id=d[\"chat_id\"], done=d[\"done\"], task_id=d[\"id\"])", "lang": "python"}, {"t": ["Type the storage module with `TaskDict`.", "Đặt type `TaskDict` cho module lưu trữ."], "f": "bot/src/todo_bot/storage.py", "act": "replace", "code": "import json\nfrom pathlib import Path\n\nfrom todo_bot.models import TaskDict\n\nDEFAULT_PATH = Path(\"tasks.json\")\n\n\ndef save_tasks(tasks: list[TaskDict], path: Path = DEFAULT_PATH) -> None:\n    with path.open(\"w\", encoding=\"utf-8\") as f:\n        json.dump(tasks, f, ensure_ascii=False, indent=2)\n\n\ndef load_tasks(path: Path = DEFAULT_PATH) -> list[TaskDict]:\n    if not path.exists():\n        return []\n    with path.open(encoding=\"utf-8\") as f:\n        data: list[TaskDict] = json.load(f)\n        return data", "lang": "python"}, {"t": ["Turn on strict mode at the end of `pyproject.toml`.", "Bật chế độ strict ở cuối `pyproject.toml`."], "f": "bot/pyproject.toml", "act": "add"
